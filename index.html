  PROB.forEach((p, i) => {
    R.prob[p.id] = { antes: "", ahora: "", visto: false };
    pantalla({ id: p.id + "a", m: "prob", min: p.min || 4, rotulo: `Problema ${i + 1} de ${PROB.length} · ¿qué piensas tú?`, titulo: p.titulo,
      html: () => `<div class="dos"><div>
          <p class="tx" data-cuenta>${esc(p.situacion)}</p>
          <p class="tx" data-cuenta><b>${esc(p.pregunta)}</b></p>
          <div class="ui" style="max-width:38em"><label for="${p.id}-antes">${esc(PT.etiquetaInicial)}</label><textarea id="${p.id}-antes"></textarea>
          <div class="grupo"><button class="btn fuerte" type="button" data-a="guardar">${esc(PT.guardar)}</button></div>
          <p class="aviso" hidden aria-live="polite"></p></div></div>
        ${figuraHTML(figDe(p), "media")}</div>`,
      doc: () => `<p>Aquí no hay respuesta correcta ni pistas: cada estudiante escribe su conclusión y la página la guarda para volver a ella después de la explicación. Idea previa que este problema pone a prueba: ${esc(p.idea || "")}</p><p>Recorre la sala y lee tres o cuatro conclusiones: te dicen si la idea prevista es la de tu curso (VERIFICAR).</p>`,
      alMostrar: con3d.alMostrar, alOcultar: con3d.alOcultar,
      init(el) {
        this.v3 = fijo3dInit(el, figDe(p));
        $('[data-a="guardar"]', el).addEventListener("click", () => {
          const t = $(`#${p.id}-antes`, el).value.trim(), m = $(".aviso", el);
          R.prob[p.id].antes = t; m.hidden = false; m.textContent = t ? PT.guardada : PT.vacia;
        });
      } });
  });

  /* ---------- 3B. Simuladores ---------- */
  const SIM_IDS = C.simuladores || [];
  SIM_IDS.forEach((id, i) => {
    const s = SIMS[id];
    pantalla({ id, m: "sim", min: s.min || 7, rotulo: `Simulador ${i + 1} de ${SIM_IDS.length} · predecir, medir y decir lo que vi`, titulo: s.titulo,
      html: () => simHTML(id, { conPred: !!s.pred, conVisto: !!s.visto }),
      doc: () => `<p>Los controles aparecen después de guardar la predicción. Cada estudiante registra tres mediciones o más y escribe lo que vio con dos datos. La página no explica todavía lo que pasó: eso viene en la explicación.</p>${docSim(s)}`,
      init(el) { this.v3 = simInit(el, id, { conPred: !!s.pred, conVisto: !!s.visto }); }, alMostrar: con3d.alMostrar, alOcultar: con3d.alOcultar });
  });

  /* ---------- 3C. Explicación ---------- */
  const EXP = C.explicacion || [], LT = C.linea, nExp = EXP.length + (LT ? 1 : 0);
  EXP.forEach((e, i) => {
    const medio = e.tabla
      ? `<div class="tabla-caja"><table><tr>${e.tabla.cab.map(c => `<th>${esc(c)}</th>`).join("")}</tr>${e.tabla.filas.map(f => `<tr>${f.map((x, k) => `<td${/^[\d,.\s]+/.test(x) && k ? ' class="num"' : ""}>${k === 0 ? chip(x) : esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`
      : e.roles ? `<div class="fila tres-c">${e.roles.map(r => `<div class="tarjeta"><span class="rol">${esc(r.sigla)}</span> <b>${esc(r.nombre)}</b><p style="margin:.2em 0 0">${esc(r.texto)}</p></div>`).join("")}</div>` : "";
    const fe = figDe(e), plano = e.caja && FIJOS[fe] ? `<figure class="figura media plano" hidden>${FIJOS[fe]}</figure>` : "";
    pantalla({ id: e.id, m: "exp", min: e.min || 2, clase: e.tabla ? "densa" : "", rotulo: `Explicación ${i + 1} de ${nExp}`, titulo: e.titulo,
      html: () => `<div class="dos"><div>
          <p class="tx" data-cuenta>${esc(e.texto)}</p>
          ${e.dato ? `<p class="tx dato-tuyo" hidden></p>` : ""}
          ${medio}${e.comprueba ? compruebaHTML(e.id, e.comprueba) : ""}</div>
        ${e.caja ? `<div><div class="con3d"><canvas class="sim e3d" tabindex="0" role="img" aria-label="${esc(e.caja.alt || "Modelo en tres dimensiones: partículas que chocan contra las paredes de una caja cerrada")}"></canvas>
            <div class="grupo ui niv3d" role="group" aria-label="${esc(e.caja.etiqueta || "Lo que puedes cambiar")}">${e.caja.niveles.map((n, k) => `<button class="btn" type="button" data-v="${k}" aria-pressed="${k === 0}">${esc(n.boton)}</button>`).join("")}</div>
            <p class="espera">Choques contra las paredes en 5 s: <b class="cuenta">contando…</b></p>
            ${ctl3d()}<p class="nota-modelo">${esc(e.caja.nota || "")}</p></div>${plano}</div>` : figuraHTML(fe, "media")}</div>`,
      doc: () => `${e.comprueba ? `<p>Respuesta: ${esc(e.comprueba.opciones[e.comprueba.correcta])}. Cada alternativa explica por qué sí o por qué no; quien se equivoca puede probar otra.</p>` : ""}${e.docente ? `<p>${esc(e.docente)}</p>` : ""}`,
      init(el) {
        if (e.comprueba) compruebaInit(el, e.id, e.comprueba);
        if (!e.caja) this.v3 = fijo3dInit(el, fe);
        if (!e.caja) return;
        const e3 = sinMov() ? null : Escena3D($("canvas.e3d", el), { N: e.caja.N || 70, V: 10, Vmax: 10, T: e.caja.niveles[0].T, piston: false });
        if (!e3) { $(".con3d", el).hidden = true; const p = $(".plano", el); if (p) p.hidden = false; return; }
        this.e3 = window.__e3d[e.id] = e3;
        elegir($(".niv3d", el), v => { e3.pon(undefined, e.caja.niveles[+v].T); e3.reinicia(); $(".cuenta", el).textContent = "contando…"; });
        ctl3dInit(el, e3);
      },
      alOcultar() { if (this.e3) { this.e3.ver(false); clearInterval(this.tic); } if (this.v3) this.v3.ocultar(); },
      alMostrar(el) {
        if (this.v3) this.v3.mostrar();
        if (this.e3) {
          this.e3.tema(); this.e3.ver(true); clearInterval(this.tic);
          this.tic = setInterval(() => { const n = this.e3.golpes5(); $(".cuenta", el).textContent = n === null ? "contando…" : String(n); }, 500);
        }
        if (!e.dato) return;
        const st = R.sim[e.dato.sim], p = $(".dato-tuyo", el), s = SIMS[e.dato.sim];
        if (!st || st.filas.length < 2) { p.hidden = true; return; }
        const a = st.filas[0].v, b = st.filas[st.filas.length - 1].v, cx = s.columnas[0], cy = s.columnas[1];
        p.hidden = false;
        p.textContent = e.dato.frase.replace("{a}", `${valor(a[cy.k], cy)} a ${valor(a[cx.k], cx)} y ${valor(b[cy.k], cy)} a ${valor(b[cx.k], cx)}`);
      } });
  });

  /* Línea de tiempo: quiénes aportaron a lo que se aprendió hoy. Una tarjeta a la vista por vez. */
  if (LT) pantalla({ id: "linea", m: "exp", min: LT.min || 2, rotulo: `Explicación ${nExp} de ${nExp} · línea de tiempo`, titulo: LT.titulo,
    html: () => {
      const x = a => 30 + (a - LT.desde) / (LT.hasta - LT.desde) * 840, paso = (LT.hasta - LT.desde) > 240 ? 100 : 50, marcas = [];
      for (let a = Math.ceil(LT.desde / paso) * paso; a <= LT.hasta; a += paso) marcas.push(a);
      const siglos = marcas.map(a => `<path d="M${x(a)} 50v8" stroke="var(--tinta-2)" stroke-width="2"/><text class="siglo" x="${x(a)}" y="72" text-anchor="middle">${a}</text>`).join("");
      const cerca = (LT.hasta - LT.desde) * 0.055;
      const puntos = LT.hitos.map((h, i) => { const arriba = !(i && h.anio - LT.hitos[i - 1].anio < cerca);
        return `<g data-p="${i}"><path d="M${x(h.anio)} ${arriba ? 20 : 26}V50" stroke="var(--tinta-2)" stroke-width="1.5"/><text x="${x(h.anio) + (arriba ? 0 : 4)}" y="${arriba ? 15 : 31}" text-anchor="${arriba ? "middle" : "start"}">${h.anio}</text><circle cx="${x(h.anio)}" cy="50" r="7" fill="var(--papel)" stroke="var(--linea)" stroke-width="3"/></g>`; }).join("");
      return `<p class="consigna" data-cuenta>${esc(LT.consigna)}</p>
      <svg class="lt-eje" viewBox="0 0 900 78" aria-hidden="true"><path d="M20 50H880" stroke="var(--linea)" stroke-width="3"/>${siglos}${puntos}</svg>
      <div class="lt-botones ui" role="group" aria-label="Hitos de la línea de tiempo">${LT.hitos.map((h, i) => `<button class="btn" type="button" data-v="${i}" aria-pressed="false"><b>${h.anio}</b> ${esc(h.corto)}</button>`).join("")}</div>
      <div class="dos par"><div class="tarjeta lt-tarjeta" aria-live="polite"></div>${LT.comprueba ? compruebaHTML("linea", LT.comprueba) : ""}</div>`; },
    doc: () => `<p>${esc(LT.docente || "")}</p>${LT.comprueba ? `<p>Respuesta: ${esc(LT.comprueba.opciones[LT.comprueba.correcta])}.</p>` : ""}<p><b>Fuentes de cada hito</b>${LT.leidas ? ` (leídas el ${esc(LT.leidas)})` : ""}: ${LT.hitos.map(h => `${h.anio}, ${(h.fuentes || []).map(f => `<a href="${esc(f[1])}" target="_blank" rel="noopener">${esc(f[0])}</a>`).join(" y ")}`).join("; ")}.</p>`,
    init(el) {
      const tarjeta = $(".lt-tarjeta", el);
      const ver = i => {
        const h = LT.hitos[i]; R.linea = R.linea || { vistos: {} }; R.linea.vistos[i] = true;
        $$(".lt-botones button", el).forEach((b, k) => b.setAttribute("aria-pressed", k === i ? "true" : "false"));
        $$(".lt-eje [data-p]", el).forEach((g, k) => { const c = $("circle", g); c.setAttribute("r", k === i ? 11 : 7); c.setAttribute("fill", k === i ? "var(--accion)" : "var(--papel)"); });
        const hf = h.figura || h.dib, sim = hf && hf.indexOf("sim:") === 0 ? SIMS[hf.slice(4)] : null;
        const dib = sim ? planoDe(sim).svg(sim) : FIJOS[hf] || "";
        tarjeta.innerHTML = `<div><h3>${esc(h.quien)}</h3><p class="donde">${h.anio} · ${esc(h.lugar)}</p><p data-cuenta>${esc(h.hallazgo)}</p><p class="hoy" data-cuenta>Hoy: ${esc(h.hoy)}</p></div>${dib ? `<figure class="figura">${dib}</figure>` : ""}`;
        if (sim) { const n = sim.niveles[sim.inicial]; planoDe(sim).pinta($("svg", tarjeta), n.v, { nivel: sim.inicial, boton: n.boton, moviendo: false }, sim); }
      };
      elegir($(".lt-botones", el), v => ver(+v));
      ver(0);
      if (LT.comprueba) compruebaInit(el, "linea", LT.comprueba);
    } });

  if (hay(C.glosario)) pantalla({ id: "glosario", m: "exp", min: 0, rotulo: "Explicación · palabras de hoy", titulo: "Glosario",
    html: () => `<div class="tabla-caja" style="max-width:46em"><table><tr><th>Palabra</th><th>Qué significa</th></tr>${C.glosario.map(g => `<tr><td><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join("")}</table></div>`,
    doc: () => `<p>${C.glosario.length} términos nuevos. Es una pantalla de consulta: no le des minutos propios.</p>` });

  /* Pregunta bisagra: con su respuesta el docente decide si avanza o reenseña */
  const BI = C.bisagra;
  if (BI) pantalla({ id: "bisagra", m: "exp", min: BI.min || 2, rotulo: "Explicación · pregunta bisagra", titulo: BI.titulo,
    html: () => `<div class="dos"><div>
        <p class="tx" data-cuenta>${esc(BI.caso)}</p>
        ${alternativas(BI.opciones, "bis-op")}
        <p class="aviso ui" id="bis-msg" hidden aria-live="polite"></p></div>
      ${figuraHTML(figDe(BI), "media")}</div>`,
    doc: () => `<p><b>Correcta: ${LETRAS[BI.correcta]}.</b> ${(BI.errores || []).map((e, i) => e ? `${LETRAS[i]}: ${esc(e)}` : "").filter(Boolean).join(" ")}</p>${conteoHTML("bis", BI.opciones.length)}<p><b>Regla:</b> ${esc(BI.regla || "")}</p><p><b>Segunda pregunta:</b> ${esc(BI.segunda || "")}</p>`,
    alMostrar: con3d.alMostrar, alOcultar: con3d.alOcultar,
    init(el) {
      this.v3 = fijo3dInit(el, figDe(BI));
      elegir($("#bis-op", el), v => {
        const i = +v, bien = i === BI.correcta, m = $("#bis-msg", el);
        if (R.bis === null) R.bis = { primero: i }; R.bis.ahora = i;
        m.hidden = false; m.textContent = (bien ? "✓ Sí. " : "↻ Todavía no. ") + BI.retro[i] + (bien ? "" : " Prueba otra.");
      });
      conteoInit(el, BI.correcta, true);
    } });

  /* ---------- 3D. Los mismos problemas, ahora con su explicación ---------- */
  PROB.forEach((p, i) => {
    const ultimo = i === PROB.length - 1;
    pantalla({ id: p.id + "d", m: "vuelta", min: p.minVuelta || 3, rotulo: `Problema ${i + 1} de ${PROB.length} · ahora con evidencia`, titulo: p.titulo, auto: ultimo ? "vuelta" : null,
      html: () => `<div class="dos par"><div>
          <p class="tx" data-cuenta>${esc(p.situacion)} <b>${esc(p.pregunta)}</b></p>
          <div class="antes"><b>${esc(PT.antes)}</b><span class="txt-antes"></span></div>
          <div class="ui"><label for="${p.id}-ahora">${esc(PT.ahora)}</label><textarea id="${p.id}-ahora"></textarea>
          <div class="grupo"><button class="btn fuerte" type="button" data-a="ver">${esc(PT.ver)}</button></div>
          <p class="aviso m" hidden aria-live="polite"></p></div></div>
        <div class="aer" hidden>
          <p><b>Afirmación.</b> ${esc(p.afirmacion)}</p><p><b>Evidencia.</b> ${esc(p.evidencia)}</p><p><b>Razonamiento.</b> ${esc(p.razonamiento)}</p>
          <p class="ui" style="border-style:dashed">${esc(PT.compara)}</p></div></div>`,
      doc: () => `<p>La conclusión inicial no se califica: se compara. La explicación aparece solo después de que el estudiante escribe lo que piensa ahora.</p><p>Destaca a quien cambió de idea: cambiar con evidencia es lo que hace la ciencia.</p>`,
      init(el) {
        $('[data-a="ver"]', el).addEventListener("click", () => {
          const t = $(`#${p.id}-ahora`, el).value.trim(), m = $(".m", el);
          R.prob[p.id].ahora = t;
          if (!t) { m.hidden = false; m.textContent = PT.primero; return; }
          m.hidden = true; R.prob[p.id].visto = true; $(".aer", el).hidden = false;
        });
      },
      alMostrar(el) { $(".txt-antes", el).textContent = R.prob[p.id].antes ? `«${R.prob[p.id].antes}»` : "(no escribiste una conclusión al inicio)"; } });
  });

  /* =====================================================================
     PRÁCTICA GUIADA E INDEPENDIENTE
     Cada actividad tiene una o más partes, y cada parte es una pantalla.
     Tipos de parte: sim, pasos, decidir (o clasificar), observa, tabla,
     investigacion, alternativas, ordenar y escrita.
     ===================================================================== */
  const PASO = { sim: "medir", pasos: "decidir paso a paso", decidir: "decidir", clasificar: "clasificar", observa: "observar", tabla: "responder", investigacion: "investigar", alternativas: "responder", ordenar: "ordenar", escrita: "escribir" };
  const SIGLA = { VI: "se cambió a propósito", VD: "se midió como resultado", VC: "quedó igual" };
  const ACTS = [];          // actividades de práctica, para el resumen final
  const estadoTxt = e => !e || !e.hecho ? "Pendiente" : e.ok ? (e.palabra || "Lograda") : "En proceso";

  const PARTES = {
    /* --- Medir con un simulador --- */
    sim(o, a, x) {
      const s = SIMS[x.sim];
      o.titulo = x.titulo || s.titulo;
      o.html = () => simHTML(x.sim, { conPred: !!(x.pred && s.pred) });
      o.doc = () => `${x.docente ? `<p>${esc(x.docente)}</p>` : ""}<p><b>Modelo:</b> ${esc(s.modelo || "")}</p>`;
      o.init = function (el) { this.v3 = simInit(el, x.sim, { conPred: !!(x.pred && s.pred) }); };
      o.alMostrar = con3d.alMostrar; o.alOcultar = con3d.alOcultar;
    },

    /* --- «Yo hago»: cada paso se responde y después muestra cómo se resuelve --- */
    pasos(o, a, x) {
      const st = R.act[o.id] = { r: [] };
      o.clase = "densa";
      o.html = () => `<p class="consigna" data-cuenta>${esc(x.consigna)}</p>
        <div class="dos par"><div class="ui"><div class="datos-g"></div>${x.puente ? `<p class="tx" data-cuenta style="font-size:.95em">${esc(x.puente)}</p>` : ""}</div>
        <div class="ui pasos-g">${x.pasos.map((p, i) => `<div class="paso-g" data-i="${i}" ${i ? "hidden" : ""}><b class="paso-t">Paso ${i + 1}. ${esc(p.pregunta)}</b><div class="grupo" role="group" aria-label="${esc(p.pregunta)}">${botonesOp(p.opciones)}</div><p class="resuelto" hidden aria-live="polite"></p></div>`).join("")}
          <p class="aviso fin" hidden>${esc(x.fin || "Así se resuelve. Ahora lo haces con menos ayuda.")}</p></div></div>`;
      o.doc = () => `<p>«Yo hago»: en cada paso el estudiante marca su respuesta antes de ver cómo se resuelve. Piensa en voz alta con los pasos de la habilidad.</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}`;
      o.init = el => {
        x.pasos.forEach((p, i) => elegir($(`.paso-g[data-i="${i}"] .grupo`, el), v => {
          if (st.r[i] === undefined) st.r[i] = v;
          const r = $(`.paso-g[data-i="${i}"] .resuelto`, el), bien = igual(v, p.correcta);
          r.hidden = false;
          r.innerHTML = `${p.sigla ? `<span class="rol">${esc(p.sigla)}</span> ` : ""}${bien ? "✓ Coincide con tu respuesta. " : `↻ Marcaste ${esc(nombreOp(p.opciones, v))}. Mira la pista: `}${esc(p.resuelto)}`;
          const sig = $(`.paso-g[data-i="${i + 1}"]`, el);
          if (sig) sig.hidden = false; else $(".fin", el).hidden = false;
        }));
      };
      o.alMostrar = el => { $(".datos-g", el).innerHTML = x.datos ? tablaDatos(x.datos) : ""; };
      o.estado = () => { const n = st.r.filter(v => v !== undefined).length; return { hecho: n > 0, ok: n === x.pasos.length, palabra: "Hecha" }; };
    },

    /* --- «Hacemos juntos»: en cada fila se elige una opción y, si la hay, la pista que la respalda --- */
    decidir(o, a, x) {
      const p = o.id, st = R.act[p] = { f: x.filas.map(() => ({ v: null, p: "", intentos: 0, ok: false })) }, conPista = hay(x.pistas);
      o.clase = "densa";
      o.html = () => `<p class="consigna" data-cuenta>${esc(x.consigna)}</p>
        <div class="dos par"><div class="ui"><div class="datos-g"></div>${x.puente ? `<p class="tx" data-cuenta style="font-size:.95em">${esc(x.puente)}</p>` : ""}
          <div class="grupo"><button class="btn" type="button" id="${p}-otro">Otro intento</button></div>
          <p class="aviso fin" hidden aria-live="polite">${esc(x.fin || "Todas las filas están resueltas.")}</p>${o.cierraMomento ? autoHTML(mom(o.m)) : ""}</div>
        <div class="ui">${x.filas.map((f, i) => `<div class="dec-fila" data-i="${i}">${f.sigla ? `<span class="rol">${esc(f.sigla)}</span>` : "<span></span>"}<div class="cuerpo">
            <div class="linea"><span>${esc(f.frase || (SIGLA[f.sigla] ? `Lo que ${SIGLA[f.sigla]}:` : ""))}</span><div class="grupo" role="group" aria-label="${esc(f.frase || f.sigla || "Fila " + (i + 1))}">${botonesOp(f.opciones || x.opciones)}</div>${conPista ? "" : `<span class="marca" aria-live="polite"></span>`}</div>
            ${conPista ? `<div class="linea"><label for="${p}-p${i}" style="margin:0">Mi pista:</label><select id="${p}-p${i}"><option value="">Elige una pista…</option>${x.pistas.map((t, k) => `<option value="${k}">${esc(t)}</option>`).join("")}</select><span class="marca" aria-live="polite"></span></div>` : ""}
            <p class="ayuda" ${i ? "hidden" : ""}>${esc(f.ayuda || "")}</p></div></div>`).join("")}</div></div>`;
      o.doc = () => `<p>«Hacemos juntos»: cada fila responde apenas está completa. La ayuda de la primera fila está a la vista; las otras aparecen solo si hace falta.</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}`;
      o.init = el => {
        const revisa = i => {
          const f = x.filas[i], r = st.f[i], fila = $(`.dec-fila[data-i="${i}"]`, el), m = $(".marca", fila), ops = f.opciones || x.opciones;
          if (r.v === null || (conPista && r.p === "")) { m.className = "marca"; m.textContent = ""; return; }
          r.intentos++;
          const corr = [].concat(f.correcta), vOk = corr.some(c => igual(c, r.v)), pOk = !conPista || (vOk && igual(f.pista[r.v], r.p)), deVar = ops.every(esVar);
          r.ok = vOk && pOk;
          fila.classList.toggle("lista", r.ok);
          if (r.ok) marca(m, true, !conPista ? "Bien" : deVar ? "Bien: variable y pista calzan" : "Bien: respuesta y pista calzan");
          else {
            marca(m, false, vOk ? (deVar ? "Revisa la pista: ¿habla de esa variable?" : "Revisa la pista: ¿habla de lo que elegiste?") : deVar ? "Revisa la variable" : "Revisa lo que elegiste");
            const ay = $(".ayuda", fila), t = (!vOk && f.error && f.error[r.v]) || f.ayuda || "";
            ay.hidden = !t; ay.textContent = t;
          }
          $(".fin", el).hidden = !st.f.every(q => q.ok);
        };
        x.filas.forEach((f, i) => {
          elegir($(`.dec-fila[data-i="${i}"] .grupo`, el), v => { st.f[i].v = v; revisa(i); });
          if (conPista) $(`#${p}-p${i}`, el).addEventListener("change", e => { st.f[i].p = e.target.value; revisa(i); });
        });
        $(`#${p}-otro`, el).addEventListener("click", () => {
          x.filas.forEach((f, i) => {
            if (st.f[i].ok) return;
            st.f[i].v = null; st.f[i].p = "";
            const fila = $(`.dec-fila[data-i="${i}"]`, el);
            $$("button[data-v]", fila).forEach(b => b.setAttribute("aria-pressed", "false"));
            const s = $("select", fila); if (s) s.value = ""; const m = $(".marca", fila); m.className = "marca"; m.textContent = "";
          });
        });
      };
      o.alMostrar = el => { $(".datos-g", el).innerHTML = x.datos ? tablaDatos(x.datos) : ""; };
      o.estado = () => ({ hecho: st.f.some(q => q.intentos), ok: st.f.every(q => q.ok) });
    },

    /* --- Observar un cambio en el tiempo: dos objetos, uno sirve para comparar --- */
    observa(o, a, x) {
      const p = o.id, st = R.act[p] = { visto: false }, plano = PLANOS[figDe(x)];
      const ini = x.estado(0), fin = x.estado(1), min = x.espera.minutos || 0;
      o.titulo = x.titulo || a.titulo;
      o.html = () => `<p class="consigna" data-cuenta>${esc(x.consigna)}</p>
        <div class="dos"><div>${caja3dHTML(figDe(x))}${plano ? `<figure class="figura plano3d">${plano.svg(x)}</figure>` : ""}
          <p class="nota-modelo">${esc(x.limite || "")} Unos ${esc(x.espera.real)} reales pasan en ${x.espera.ms / 1000} segundos.${x.cita ? ` Emula la actividad «${esc(x.cita.titulo)}», de ${esc(x.cita.institucion)}.` : ""}</p></div>
        <div class="ui"><div class="grupo"><button class="btn fuerte" type="button" id="${p}-ir">Empezar</button><button class="btn" type="button" id="${p}-cero">Reiniciar</button><span class="espera" id="${p}-min" aria-live="off">Minuto 0</span></div>
          <div class="tabla-caja"><table><tr><th>Instrumento</th>${x.objetos.map(b => `<th>${esc(b.nombre)}<br>inicio</th><th>${esc(b.nombre)}<br>final</th>`).join("")}</tr>
            ${x.medidas.map(m => `<tr><td>${esc(m.nombre)}</td>${x.objetos.map(b => `<td class="num">${valor(ini[b.id][m.k], m)}</td><td class="num" id="${p}-${m.k}${b.id}">…</td>`).join("")}</tr>`).join("")}</table></div>
          <p class="aviso" id="${p}-msg" hidden aria-live="polite">${esc(x.listo || "La tabla quedó completa. Pasa a la pantalla siguiente para responder.")}</p></div></div>`;
      o.doc = () => `<p>Cada estudiante observa solo y en silencio.${x.docente ? " " + esc(x.docente) : ""}</p><p><b>Modelo:</b> ${esc(x.modelo || "")}</p>`;
      o.alMostrar = con3d.alMostrar; o.alOcultar = con3d.alOcultar;
      o.init = function (el) {
        const svg = $(".figura svg", el), ir = $(`#${p}-ir`, el);
        let raf = 0, pasado = 0, t0 = 0, corriendo = false, ultimo = 0;
        const c3 = $(".e3d-caja", el), v3 = this.v3 = c3 ? vista3d(c3, figDe(x), () => pinta(ultimo)) : null;
        const pinta = f => {
          const v = x.estado(f); ultimo = f;
          if (v3 && v3.tresD) v3.pinta(v); else if (plano) plano.pinta(svg, v);
          $(`#${p}-min`, el).textContent = min ? "Minuto " + Math.round(f * min) : Math.round(f * 100) + NB + "%";
          if (f >= 1) {
            x.medidas.forEach(m => x.objetos.forEach(b => { $(`#${p}-${m.k}${b.id}`, el).textContent = valor(fin[b.id][m.k], m); }));
            $(`#${p}-msg`, el).hidden = false; st.visto = true; corriendo = false; ir.textContent = "Empezar"; ir.disabled = true;
          }
        };
        const paso = ahora => {
          const f = Math.min(1, (pasado + ahora - t0) / x.espera.ms); pinta(f);
          if (f < 1 && corriendo) raf = requestAnimationFrame(paso);
        };
        ir.addEventListener("click", () => {
          if (sinMov()) { pinta(1); return; }
          if (corriendo) { corriendo = false; pasado += performance.now() - t0; cancelAnimationFrame(raf); ir.textContent = "Seguir"; }
          else { corriendo = true; t0 = performance.now(); ir.textContent = "Pausar"; raf = requestAnimationFrame(paso); }
        });
        $(`#${p}-cero`, el).addEventListener("click", () => {
          cancelAnimationFrame(raf); corriendo = false; pasado = 0; ir.disabled = false; ir.textContent = "Empezar"; $(`#${p}-msg`, el).hidden = true;
          x.medidas.forEach(m => x.objetos.forEach(b => { $(`#${p}-${m.k}${b.id}`, el).textContent = "…"; })); pinta(0);
        });
        pinta(0);
      };
    },

    /* --- «Primero intento solo»: tabla que se completa con listas, sin pasos dados --- */
    tabla(o, a, x) {
      const p = o.id, st = R.act[p] = { sel: {}, intentos: 0, ok: false };
      const opsDe = c => c.variables ? c.variables.map(k => [k, VARS[k].nombre]) : c.opciones.map((t, k) => Array.isArray(t) ? t : [k, t]);
      o.titulo = x.titulo || a.titulo;
      o.html = () => `<p class="consigna" data-cuenta>${esc(x.consigna)}</p>
        <div class="ui"><div class="tabla-caja"><table id="${p}-t"><tr><th>${esc(x.cabecera || "")}</th>${(x.datos || []).map(d => `<th>${esc(d)}</th>`).join("")}${x.columnas.map(c => `<th>${esc(c.titulo)}</th>`).join("")}<th></th></tr>
          ${x.filas.map((f, i) => `<tr data-i="${i}"><td>${esc(f.nombre)}</td>${(f.datos || []).map(d => `<td class="num">${esc(d)}</td>`).join("")}
            ${x.columnas.map((c, k) => `<td><select id="${p}-c${k}-${i}" aria-label="${esc(c.titulo)}: ${esc(f.nombre)}"><option value="">Elige…</option>${opsDe(c).map(q => `<option value="${esc(q[0])}">${esc(q[1])}</option>`).join("")}</select></td>`).join("")}
            <td><span class="marca" aria-live="polite"></span></td></tr>`).join("")}</table></div>
          ${x.extra ? `<div class="preg" style="box-shadow:none;border:2px solid var(--borde-suave)"><p>${esc(x.extra.pregunta)}</p><div class="grupo" role="group" aria-label="${esc(x.extra.pregunta)}" id="${p}-x">${botones(x.extra.opciones)}</div><p class="retro" id="${p}-xr" hidden aria-live="polite"></p></div>` : ""}
          <div class="grupo"><button class="btn fuerte" type="button" id="${p}-ok">Comprobar</button><button class="btn" type="button" id="${p}-otro">Otro intento</button>
            ${hay(x.ayudas) ? `<span style="font-weight:700">Si te trabas:</span>${x.ayudas.map((t, i) => `<button class="btn" type="button" data-ay="${i}">Ayuda ${i + 1}</button>`).join("")}` : ""}</div>
          <p class="aviso" id="${p}-msg" hidden aria-live="polite"></p></div>`;
      o.doc = () => `<p>«Primero intento solo»: sin pasos dados. «Comprobar» responde recién cuando la tabla está completa. Las ayudas van de menos a más: releer, pista y parte resuelta.</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}`;
      o.init = el => {
        const sel = st.sel, msg = $(`#${p}-msg`, el), decir = t => { msg.hidden = false; msg.textContent = t; };
        $$(`#${p}-t select`, el).forEach(s => s.addEventListener("change", () => { sel[s.id] = s.value; }));
        if (x.extra) elegir($(`#${p}-x`, el), v => { sel.x = +v; $(`#${p}-xr`, el).hidden = true; });
        $(`#${p}-ok`, el).addEventListener("click", () => {
          const faltan = x.filas.some((f, i) => x.columnas.some((c, k) => !sel[`${p}-c${k}-${i}`])) || (x.extra && sel.x === undefined);
          if (faltan) { decir("Todavía hay casillas sin responder. Complétalas con tu mejor idea y comprueba: el primer intento no tiene nota."); return; }
          st.intentos++;
          let bien = 0;
          x.filas.forEach((f, i) => {
            const m = $(`#${p}-t tr[data-i="${i}"] .marca`, el), partes = [];
            x.columnas.forEach((c, k) => { if (!igual(sel[`${p}-c${k}-${i}`], f.correctas[k])) partes.push(c.parte || c.titulo.toLowerCase()); });
            if (partes.length) marca(m, false, "Revisa " + (partes.length > 1 ? partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1] : partes[0])); else { marca(m, true, "Bien"); bien++; }
          });
          let xb = true;
          if (x.extra) { const r = $(`#${p}-xr`, el); xb = sel.x === x.extra.correcta; r.hidden = false; r.textContent = (xb ? "✓ Sí. " : "↻ Todavía no. ") + x.extra.retro[sel.x]; }
          st.ok = bien === x.filas.length && xb;
          if (st.primero === undefined) st.primero = st.ok;
          decir(st.ok ? (x.logrado || "Toda la tabla está bien.") : "Hay partes por revisar. Cambia lo que marcaste con ↻ y comprueba de nuevo, o pide una ayuda.");
        });
        $(`#${p}-otro`, el).addEventListener("click", () => {
          $$(`#${p}-t .marca.revisa`, el).forEach(m => { m.className = "marca"; m.textContent = ""; });
          decir("Cambia lo que quieras y comprueba de nuevo.");
        });
        $$("[data-ay]", el).forEach(b => b.addEventListener("click", () => { st.ayuda = Math.max(st.ayuda || 0, +b.dataset.ay + 1); decir(`Ayuda ${+b.dataset.ay + 1}: ${x.ayudas[+b.dataset.ay]}`); }));
      };
      o.estado = () => ({ hecho: st.intentos > 0, ok: st.ok, extra: st.intentos ? `intentos: ${st.intentos}` : "" });
    },

    /* --- «Ahora solo»: el estudiante decide qué cambia, qué mide y qué mantiene igual --- */
    investigacion(o, a, x) {
      const p = o.id, ks = x.variables, PLAN = x.plan || [["vi", "Cambio a propósito"], ["vd", "Mido"], ["vc", "Mantengo igual"]];
      let st = R.act[p] = { plan: {}, activo: false, filas: [], x: null, roles: {}, ok: false, intentos: 0, txt: "" };
      const dec = x.decimales || {}, fmt = (k, n) => num(n, dec[k] || 0) + NB + x.unidades[k];
      const calc = n => x.calcula(st.plan.vi, st.plan.vd, n);
      window.__calcI2 = (plan, n) => x.calcula(plan.vi, plan.vd, n);
      o.titulo = x.titulo || a.titulo;
      o.html = () => `<p class="consigna" data-cuenta>${esc(x.consigna)}</p>
        <div class="tres"><div>${x.caja ? `<canvas class="sim e3d" id="${p}-caja" width="640" height="400" tabindex="0" role="img" aria-label="${esc(x.caja.alt || "Caja con partículas y una pared que se mueve")}"></canvas>
            ${ctl3d()}` : `<figure class="figura">${TABLERO.svgDe(ks.map(k => ({ k, nombre: x.instrumentos[k], unidad: x.unidades[k], dec: dec[k] || 0, min: Math.min.apply(0, x.niveles[k]), max: Math.max.apply(0, x.niveles[k]) })))}</figure>`}
            <p class="nota-modelo">${esc(x.limite || "")} ${x.caja ? `<span class="solo3d">Arrastra la caja para girarla.</span>` : ""}${x.cita ? ` Emula la simulación «${esc(x.cita.titulo)}», de ${esc(x.cita.institucion)}.` : ""}</p></div>
          <div class="ui">
            <div id="${p}-plan"><b class="paso-t">1. Mi plan: una variable distinta en cada fila</b>
              ${PLAN.map(q => `<div class="plan-fila plan" data-plan="${q[0]}"><span class="frase">${esc(q[1])}:</span><div class="grupo" role="group" aria-label="${esc(q[1])}">${botonesOp(ks)}</div></div>`).join("")}
              <div class="grupo"><button class="btn fuerte" type="button" id="${p}-ir">Empezar con este plan</button></div></div>
            <div id="${p}-lab" hidden><b class="paso-t">2. Mis datos: registra tres mediciones o más</b>
              <p id="${p}-como" style="margin:0 0 .2em"></p>
              <div class="grupo" role="group" aria-label="Valor que eliges" id="${p}-niv"></div>
              <p class="espera" id="${p}-lec" aria-live="polite"></p>
              <div class="grupo"><button class="btn fuerte" type="button" id="${p}-reg">Registrar medición</button><button class="btn fuerte" type="button" id="${p}-sig" hidden>Ya tengo mis datos</button></div></div>
            <div id="${p}-roles" hidden><b class="paso-t">3. Ponle nombre a cada rol</b>
              ${["vd", "vc", "vi"].map(k => `<div class="plan-fila" data-rolf="${k}"><span class="frase"></span><div class="grupo" role="group" aria-label="Rol">${["VI", "VD", "VC"].map(r => `<button class="btn" type="button" data-v="${r.toLowerCase()}" aria-pressed="false">${r}</button>`).join("")}</div><span class="marca" aria-live="polite"></span></div>`).join("")}
              <div class="grupo"><button class="btn fuerte" type="button" id="${p}-ok">Comprobar</button><button class="btn fuerte" type="button" id="${p}-sig2" hidden>Dejar mi pista</button></div>
              ${hay(x.ayudas) ? `<div class="grupo"><span style="font-weight:700">Si te trabas:</span>${x.ayudas.map((t, i) => `<button class="btn" type="button" data-ay="${i}">Ayuda ${i + 1}</button>`).join("")}</div>` : ""}</div>
            <div id="${p}-esc" hidden><b class="paso-t">4. Mi pista</b><label for="${p}-txt">Termina la frase: «${esc(x.escrita.inicio)}»</label><textarea id="${p}-txt"></textarea>
              <div class="grupo"><button class="btn fuerte" type="button" id="${p}-ver">Guardar y comparar</button></div>
              <div class="aviso" id="${p}-mod" hidden></div></div>
            <p class="aviso" id="${p}-msg" hidden aria-live="polite"></p></div>
          <div class="ui"><div class="etapa-plan" id="${p}-res" hidden></div><div class="tabla-caja"><table id="${p}-tabla"></table></div>
            <div class="grupo"><button class="btn" type="button" id="${p}-cero" hidden>Hacer otro plan</button></div>${o.cierraMomento ? autoHTML(mom(o.m)) : ""}</div></div>`;
      o.doc = () => `<p>«Ahora solo»: cada estudiante hace su plan, mide, nombra los roles y deja su pista por escrito.</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}<p><b>Modelo:</b> ${esc(x.modelo || "")}</p>`;
      o.init = function (el) {
        const q = s => $(`#${p}-${s}`, el), msg = q("msg"), decir = t => { msg.hidden = !t; msg.textContent = t || ""; };
        const b0 = x.base, aCaja = e => x.caja.de(e), c0 = x.caja ? aCaja(b0) : null;
        const caja = !x.caja ? null : Escena3D(q("caja"), { N: x.caja.N || 60, V: c0.V, Vmax: x.caja.Vmax, T: c0.T }) || cajaParticulas(q("caja"), c0.V, c0.T, x.caja.Vmax);
        const fig = caja ? null : $(".figura svg", el);
        const ponCaja = e => { if (caja) { const c = aCaja(e); caja.pon(c.V, c.T); } else TABLERO.pintaDe(fig, e); };
        if (caja) window.__e3d[p] = caja;
        const tabla = () => {
          const { vi, vd } = st.plan;
          q("tabla").innerHTML = !st.activo ? `<tr><td class="vacia">Aquí aparecen tus mediciones.</td></tr>`
            : `<tr><th>${esc(x.instrumentos[vi])} (${x.unidades[vi]})</th><th>${esc(x.instrumentos[vd])} (${x.unidades[vd]})</th></tr>` +
              (st.filas.length ? st.filas.map(f => `<tr><td class="num">${fmt(vi, f.x)}</td><td class="num">${fmt(vd, f.y)}</td></tr>`).join("") : `<tr><td class="vacia" colspan="2">Aquí aparecen tus mediciones.</td></tr>`);
        };
        const poner = n => {
          st.x = n; const e = calc(n); ponCaja(e);
          $$(`#${p}-niv button`, el).forEach(b => b.setAttribute("aria-pressed", +b.dataset.x === n ? "true" : "false"));
          q("lec").textContent = `${x.instrumentos[st.plan.vd]}: ${fmt(st.plan.vd, e[st.plan.vd])}`;
        };
        PLAN.forEach(f => elegir($(`[data-plan="${f[0]}"] .grupo`, el), v => { st.plan[f[0]] = v; decir(""); }));
        q("ir").addEventListener("click", () => {
          const { vi, vd, vc } = st.plan;
          if (!vi || !vd || !vc) { decir(x.falta || "Elige una variable en cada fila."); return; }
          if (vi === vd || vi === vc || vd === vc) { decir(x.repetida || "Usa una variable distinta en cada fila."); return; }
          if (x.noMedir && x.noMedir[vd]) { decir(x.noMedir[vd]); return; }
          decir(""); st.activo = true; st.filas = []; st.roles = {}; st.ok = false;
          q("plan").hidden = true; q("lab").hidden = false; q("cero").hidden = false;
          const res = q("res"); res.hidden = false;
          res.innerHTML = `<p><b>Mi plan:</b> cambio ${esc(con(vi))}, mido ${esc(con(vd))} y mantengo igual ${esc(con(vc))}.</p>`;
          q("como").textContent = `Cambias ${con(vi)}: ${x.como[vi].toLowerCase()} Mantienes igual ${con(vc)}.`;
          q("niv").innerHTML = x.niveles[vi].map(n => `<button class="btn" type="button" data-x="${n}" aria-pressed="false">${fmt(vi, n)}</button>`).join("");
          poner(x.niveles[vi][0]); tabla(); $(`#${p}-niv button`, el).focus();
        });
        q("niv").addEventListener("click", e => { const b = e.target.closest("button[data-x]"); if (b) { poner(+b.dataset.x); decir(""); } });
        q("reg").addEventListener("click", () => {
          const foco = () => { const b = $(`#${p}-niv [aria-pressed="true"]`, el); if (b) b.focus(); };
          if (st.filas.some(f => f.x === st.x)) { decir("Esa medición ya está en tu tabla. Elige otro valor y registra."); foco(); return; }
          st.filas.push({ x: st.x, y: calc(st.x)[st.plan.vd] }); st.filas.sort((m, n) => m.x - n.x); tabla(); foco();
          if (st.filas.length >= 3) { decir("Ya tienes tres mediciones o más."); q("sig").hidden = false; }
          else decir(`Medición registrada. Llevas ${st.filas.length} de 3.`);
        });
        q("sig").addEventListener("click", () => {
          const fr = { vi: "Cambié ", vd: "Medí ", vc: "No cambié " };
          $$("[data-rolf]", el).forEach(f => { $(".frase", f).textContent = fr[f.dataset.rolf] + con(st.plan[f.dataset.rolf]); });
          q("lab").hidden = true; q("roles").hidden = false; decir(""); $(`#${p}-roles button`, el).focus();
        });
        q("sig2").addEventListener("click", () => { q("roles").hidden = true; q("esc").hidden = false; decir(""); q("txt").focus(); });
        q("cero").addEventListener("click", () => {
          st.activo = false; st.filas = []; st.plan = {}; st.roles = {}; decir("");
          q("plan").hidden = false; ["lab", "roles", "esc", "mod", "res", "cero", "sig", "sig2"].forEach(s => { q(s).hidden = true; });
          $$(`#${p}-plan button, #${p}-roles button[data-v]`, el).forEach(b => b.setAttribute("aria-pressed", "false"));
          $$(`#${p}-roles .marca`, el).forEach(m => { m.className = "marca"; m.textContent = ""; });
          ponCaja(b0); tabla();
        });
        $$("[data-rolf]", el).forEach(f => elegir($(".grupo", f), v => { st.roles[f.dataset.rolf] = v; }));
        q("ok").addEventListener("click", () => {
          if (Object.keys(st.roles).length < 3) { decir("Elige VI, VD o VC en las tres frases y comprueba."); return; }
          st.intentos++; let bien = 0;
          $$("[data-rolf]", el).forEach(f => { const k = f.dataset.rolf, ok = st.roles[k] === k; if (ok) bien++; marca($(".marca", f), ok, ok ? "Bien" : "Revisa"); });
          st.ok = bien === 3;
          if (st.primero === undefined) st.primero = st.ok;
          decir(st.ok ? "Los tres roles calzan con lo que hiciste." : "Hay roles por revisar. Piensa: ¿qué elegiste tú?, ¿qué leíste?, ¿qué no tocaste? Cambia y comprueba de nuevo.");
          q("sig2").hidden = !st.ok;
        });
        q("ver").addEventListener("click", () => {
          st.txt = q("txt").value.trim();
          if (!st.txt) { decir("Escribe tu frase primero. Después aparece una frase posible para comparar."); return; }
          const { vi, vd } = st.plan, f0 = st.filas[0], f1 = st.filas[st.filas.length - 1], m = q("mod");
          m.hidden = false; decir("");
          m.innerHTML = `<p><b class="tit">Una frase posible:</b> «La variable dependiente fue ${esc(con(vd))}, porque cada vez leí ${esc((x.leo && x.leo[vd]) || "el instrumento")}: marcó ${fmt(vd, f0.y)} con ${fmt(vi, f0.x)} y ${fmt(vd, f1.y)} con ${fmt(vi, f1.x)}.»</p>${criteriosHTML(p, x.escrita.criterios, "Mi frase tiene:")}`;
        });
        $$(`#${p}-roles [data-ay]`, el).forEach(b => b.addEventListener("click", () => { st.ayuda = Math.max(st.ayuda || 0, +b.dataset.ay + 1); decir(`Ayuda ${+b.dataset.ay + 1}: ${x.ayudas[+b.dataset.ay].replace("{vi}", con(st.plan.vi))}`); }));
        tabla(); ponCaja(b0);
        if (caja) ctl3dInit(el, caja);
        this.caja = caja;
      };
      o.alMostrar = function () { if (!this.caja) return; if (this.caja.tema) this.caja.tema(); this.caja.ver(true); };
      o.alOcultar = function () { if (this.caja) this.caja.ver(false); };
      o.estado = () => ({ hecho: st.activo || st.intentos > 0, ok: st.ok, extra: st.txt ? `«${st.txt}»` : "" });
    },

    /* --- Una pregunta de alternativas con explicación en cada una --- */
    alternativas(o, a, x) {
      const p = o.id, st = R.act[p] = { primero: null, ahora: null };
      o.titulo = x.titulo || a.titulo;
      o.html = () => `<div class="dos"><div><p class="tx" data-cuenta>${esc(x.caso)}</p>${alternativas(x.opciones, p + "-op")}
          <p class="aviso ui" id="${p}-msg" hidden aria-live="polite"></p></div>${figuraHTML(figDe(x), "media")}</div>`;
      o.doc = () => `<p><b>Correcta: ${LETRAS[x.correcta]}.</b> ${(x.errores || []).map((e, i) => e ? `${LETRAS[i]}: ${esc(e)}` : "").filter(Boolean).join(" ")}</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}`;
      o.alMostrar = con3d.alMostrar; o.alOcultar = con3d.alOcultar;
      o.init = function (el) {
        this.v3 = fijo3dInit(el, figDe(x));
        elegir($(`#${p}-op`, el), v => {
          const i = +v, bien = i === x.correcta, m = $(`#${p}-msg`, el);
          if (st.primero === null) st.primero = i; st.ahora = i;
          m.hidden = false; m.textContent = (bien ? "✓ Sí. " : "↻ Todavía no. ") + x.retro[i] + (bien ? "" : " Prueba otra.");
        });
      };
      o.estado = () => ({ hecho: st.ahora !== null, ok: st.ahora === x.correcta });
    },

    /* --- Ordenar una secuencia con botones para subir y bajar --- */
    ordenar(o, a, x) {
      const p = o.id, n = x.items.length, st = R.act[p] = { orden: [], intentos: 0, ok: false };
      /* Orden de partida: fijo y distinto del correcto (el mismo para todo el curso) */
      if (x.partida) st.orden = x.partida.slice();
      else {
        let sem = n * 7 + 3; const azar = () => { sem = (sem * 16807) % 2147483647; return sem / 2147483647; };
        st.orden = x.items.map((t, i) => i);
        for (let i = n - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)), t = st.orden[i]; st.orden[i] = st.orden[j]; st.orden[j] = t; }
        if (n > 1 && st.orden.every((v, i) => v === i)) { st.orden[0] = 1; st.orden[1] = 0; }
      }
      o.titulo = x.titulo || a.titulo;
      o.html = () => `<p class="consigna" data-cuenta>${esc(x.consigna)}</p>
        <div class="dos par"><div class="ui"><ol class="orden" id="${p}-lista"></ol>
          <div class="grupo"><button class="btn fuerte" type="button" id="${p}-ok">Comprobar</button>${hay(x.ayudas) ? `<span style="font-weight:700">Si te trabas:</span>${x.ayudas.map((t, i) => `<button class="btn" type="button" data-ay="${i}">Ayuda ${i + 1}</button>`).join("")}` : ""}</div>
          <p class="aviso" id="${p}-msg" hidden aria-live="polite"></p></div>${figuraHTML(figDe(x), "media")}</div>`;
      o.doc = () => `<p>Orden correcto: ${x.items.map((t, i) => `${i + 1}) ${esc(t)}`).join(" ")}</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}`;
      o.alMostrar = con3d.alMostrar; o.alOcultar = con3d.alOcultar;
      o.init = function (el) {
        this.v3 = fijo3dInit(el, figDe(x));
        const lista = $(`#${p}-lista`, el), msg = $(`#${p}-msg`, el), decir = t => { msg.hidden = false; msg.textContent = t; };
        const pinta = (marcas, foco) => {
          lista.innerHTML = st.orden.map((k, i) => `<li data-i="${i}"><span class="txt">${esc(x.items[k])}</span><span class="grupo"><button class="btn" type="button" data-m="-1" aria-label="Subir: ${esc(x.items[k])}" ${i ? "" : "disabled"}>↑</button><button class="btn" type="button" data-m="1" aria-label="Bajar: ${esc(x.items[k])}" ${i < n - 1 ? "" : "disabled"}>↓</button></span>${marcas ? `<span class="marca ${k === i ? "bien" : "revisa"}">${k === i ? "✓" : "↻"}</span>` : ""}</li>`).join("");
          if (foco) { const b = $(`li[data-i="${foco[0]}"] [data-m="${foco[1]}"]:not([disabled])`, lista) || $(`li[data-i="${foco[0]}"] button:not([disabled])`, lista); if (b) b.focus(); }
        };
        lista.addEventListener("click", e => {
          const b = e.target.closest("button[data-m]"); if (!b) return;
          const i = +b.closest("li").dataset.i, j = i + (+b.dataset.m), t = st.orden[i];
          st.orden[i] = st.orden[j]; st.orden[j] = t; msg.hidden = true; pinta(false, [j, b.dataset.m]);
        });
        $(`#${p}-ok`, el).addEventListener("click", () => {
          st.intentos++; st.ok = st.orden.every((k, i) => k === i);
          if (st.primero === undefined) st.primero = st.ok;
          pinta(true);
          decir(st.ok ? (x.logrado || "El orden es correcto.") : "Hay pasos fuera de lugar: están marcados con ↻. Muévelos y comprueba de nuevo.");
        });
        $$("[data-ay]", el).forEach(b => b.addEventListener("click", () => { st.ayuda = Math.max(st.ayuda || 0, +b.dataset.ay + 1); decir(`Ayuda ${+b.dataset.ay + 1}: ${x.ayudas[+b.dataset.ay]}`); }));
        pinta(false);
      };
      o.estado = () => ({ hecho: st.intentos > 0, ok: st.ok, extra: st.intentos ? `intentos: ${st.intentos}` : "" });
    },

    /* --- Respuesta escrita que se compara con una respuesta posible --- */
    escrita(o, a, x) {
      const p = o.id, st = R.act[p] = { txt: "" };
      o.titulo = x.titulo || a.titulo;
      o.html = () => `<div class="dos"><div><p class="tx" data-cuenta>${esc(x.caso)}</p>
          <div class="ui" style="max-width:38em"><label for="${p}-txt">${esc(x.inicio)}</label><textarea id="${p}-txt"></textarea>
          <div class="grupo"><button class="btn fuerte" type="button" id="${p}-ok">Guardar y comparar</button></div>
          <div class="aviso" id="${p}-mod" hidden aria-live="polite"></div></div></div>
        ${figuraHTML(figDe(x), "media")}</div>`;
      o.doc = () => `<p>${x.optativa ? "Optativo, sin minutos propios. " : ""}Respuesta posible: ${esc(x.modelo)}</p>${x.docente ? `<p>${esc(x.docente)}</p>` : ""}`;
      o.alMostrar = con3d.alMostrar; o.alOcultar = con3d.alOcultar;
      o.init = function (el) {
        this.v3 = fijo3dInit(el, figDe(x));
        $(`#${p}-ok`, el).addEventListener("click", () => {
          const t = $(`#${p}-txt`, el).value.trim(), m = $(`#${p}-mod`, el); st.txt = t; R.des.txt = t; m.hidden = false;
          m.innerHTML = t ? `<p><b class="tit">Una respuesta posible:</b> ${esc(x.modelo)}</p>${criteriosHTML(p, x.criterios, "Mi respuesta tiene:")}` : "Escribe tu idea primero. Después aparece una respuesta posible para comparar.";
        });
      };
      o.estado = () => ({ hecho: !!st.txt, ok: !!st.txt, palabra: "Escrita" });
    }
  };
  PARTES.clasificar = PARTES.decidir;

  /* Arma las pantallas de un momento de práctica a partir de sus actividades */
  function practica(lista, m) {
    const pant = [];
    (lista || []).forEach(a => {
      const reg = { a, partes: [] }; ACTS.push(reg);
      a.partes.forEach((x, k) => {
        const varias = a.partes.length > 1;
        const o = { id: x.id || a.id + (varias ? "abcdef"[k] : ""), m, min: x.min, rotulo: a.rotulo + (varias ? ` · ${k + 1}. ${x.paso || PASO[x.tipo]}` : ""), titulo: x.titulo || a.titulo, parte: x };
        reg.partes.push(o); pant.push(o);
      });
    });
    /* La autoevaluación del momento va en la última pantalla que no es simulador */
    const ult = pant[pant.length - 1];
    pant.forEach(o => { o.cierraMomento = o === ult && (o.parte.tipo === "decidir" || o.parte.tipo === "clasificar" || o.parte.tipo === "investigacion"); });
    if (ult && !ult.cierraMomento) ult.auto = m;
    const sinMin = pant.filter(o => o.min === undefined), resto = (mom(m) ? mom(m).min : 0) - pant.reduce((s, o) => s + (o.min || 0), 0);
    sinMin.forEach(o => { o.min = Math.max(1, Math.round(resto / sinMin.length)); });
    pant.forEach(o => { PARTES[o.parte.tipo](o, ACTS.find(r => r.partes.indexOf(o) >= 0).a, o.parte); pantalla(o); });
  }
  practica(C.guiada, "guiada");
  practica(C.independiente, "indep");

  /* Desafío optativo para quien termina antes */
  if (C.desafio) {
    const o = { id: "desafio", m: hay(C.independiente) ? "indep" : hay(C.guiada) ? "guiada" : "exp", min: 0, rotulo: "Desafío · si terminaste", titulo: C.desafio.titulo };
    PARTES.escrita(o, C.desafio, Object.assign({ optativa: true }, C.desafio)); pantalla(o);
  }

  /* ---------- 6. Ticket de salida ---------- */
  const TK = C.ticket || [];
  TK.forEach((t, i) => {
    pantalla({ id: t.id, m: "ticket", min: t.min || 1.5, rotulo: `Ticket de salida · pregunta ${i + 1} de ${TK.length} · individual y sin nota`, titulo: "Ticket de salida", clase: "ticket",
      html: () => `<p class="tx" data-cuenta>${esc(t.texto)}</p>
        <div class="opciones ui" role="group" aria-label="Alternativas" data-t="${t.id}">${t.opciones.map((o, k) => `<button class="btn" type="button" data-v="${k}" aria-pressed="false"><span class="letra">${LETRAS[k]}</span><span>${esc(o)}</span><span class="retro" hidden></span></button>`).join("")}</div>
        <p class="ui pie-t" style="margin:0">Tu respuesta queda guardada. La explicación de cada alternativa aparece cuando termines las ${TK.length} preguntas.</p>`,
      doc: () => { const c = C.criterios.find(q => q.id === t.criterio); return `<p><b>Correcta: ${LETRAS[t.correcta]}.</b>${c ? ` Criterio: ${esc(c.texto)}` : ""}</p><ul>${(t.errores || []).map((e, k) => e ? `<li>${LETRAS[k]}: ${esc(e)}</li>` : "").join("")}</ul>${conteoHTML(t.id, t.opciones.length)}`; },
      init(el) {
        elegir($(`[data-t="${t.id}"]`, el), v => { if (!R.ticketVisto) R.ticket[t.id] = +v; });
        $(`[data-t="${t.id}"]`, el).addEventListener("click", e => { if (R.ticketVisto) { e.stopPropagation(); this.alMostrar(el); } }, true);
        conteoInit(el, t.correcta, false);
      },
      alMostrar(el) {
        const caja = $(`[data-t="${t.id}"]`, el);
        if (R.ticketVisto) $(".pie-t", el).textContent = "Ya viste tus resultados: las respuestas quedaron fijas. Lee por qué cada alternativa es o no es la respuesta.";
        $$("button[data-v]", caja).forEach((b, k) => {
          b.setAttribute("aria-pressed", R.ticket[t.id] === k ? "true" : "false");
          const r = $(".retro", b); r.hidden = !R.ticketVisto;
          if (R.ticketVisto) { r.textContent = (k === t.correcta ? "✓ " : "") + t.retro[k]; b.classList.toggle("es-correcta", k === t.correcta); }
        });
      } });
  });

  if (TK.length) pantalla({ id: "tfin", m: "ticket", min: 0, rotulo: "Ticket de salida · mis resultados", titulo: "¿Qué logré hoy?", auto: "ticket",
    html: () => `<div class="ui"><p class="tx" id="tf-msg"></p><div class="grupo" id="tf-ir"></div>
      <div class="grupo"><button class="btn fuerte" type="button" id="tf-ver">Ver mis resultados</button></div>
      <div class="tabla-caja" id="tf-res" hidden style="max-width:60em"></div></div>`,
    doc: () => `<p>Individual y sin nota. ${esc((C.cierre && C.cierre.docenteTicket) || "")}</p>`,
    init(el) { $("#tf-ver", el).addEventListener("click", () => { R.ticketVisto = true; this.alMostrar(el); }); },
    alMostrar(el) {
      const faltan = TK.filter(t => R.ticket[t.id] === undefined), msg = $("#tf-msg", el), ver = $("#tf-ver", el), res = $("#tf-res", el);
      $("#tf-ir", el).innerHTML = faltan.map(t => `<button class="btn" type="button" data-ir="${t.id}">Ir a la pregunta ${TK.indexOf(t) + 1}</button>`).join("");
      $$("[data-ir]", el).forEach(b => b.addEventListener("click", () => irA(b.dataset.ir)));
      if (faltan.length) { msg.textContent = `Te falta responder ${faltan.length === 1 ? "una pregunta" : faltan.length + " preguntas"}. Los resultados aparecen cuando estén las ${TK.length}.`; ver.hidden = true; res.hidden = true; return; }
      if (!R.ticketVisto) { msg.textContent = `Respondiste las ${TK.length} preguntas. Cuando veas los resultados, ya no podrás cambiarlas.`; ver.hidden = false; res.hidden = true; return; }
      msg.textContent = "Lee la explicación de cada respuesta. Puedes volver a cada pregunta para ver todas las alternativas explicadas.";
      ver.hidden = true; res.hidden = false;
      res.innerHTML = `<table><tr><th>Pregunta</th><th>Tu respuesta</th><th>Por qué</th></tr>${TK.map((t, i) => {
        const k = R.ticket[t.id], bien = k === t.correcta;
        return `<tr><td>${i + 1}</td><td><span class="marca ${bien ? "bien" : "revisa"}">${bien ? "✓" : "↻"} ${LETRAS[k]}. ${esc(t.opciones[k])}</span></td><td>${esc(t.retro[k])}${bien ? "" : ` La respuesta es ${LETRAS[t.correcta]}: ${esc(t.retro[t.correcta])}`}</td></tr>`;
      }).join("")}</table>`;
    } });

  /* ---------- Mi clase de hoy ---------- */
  const CI = C.cierre || {};
  pantalla({ id: "cierre", m: "cierre", min: 0, rotulo: "Cierre", titulo: "Mi clase de hoy", clase: "imprime resumen densa",
    html: () => `<div id="res"></div><div class="grupo ui no-imp"><button class="btn fuerte" type="button" id="imp" hidden>${esc(CI.imprimir || "Imprimir mis respuestas")}</button></div>`,
    doc: () => `${DG ? `<p>${esc(DG.respuesta)}</p>` : ""}<p>Esta pantalla reúne lo que cada estudiante escribió. Nada se guarda ni se envía: si necesitas evidencia, pide que la impriman o la muestren antes de cerrar la página.</p>`,
    init(el) {
      let enMarco = true; try { enMarco = window.self !== window.top; } catch (e) { enMarco = true; }
      const b = $("#imp", el); b.hidden = enMarco; b.addEventListener("click", () => window.print());
    },
    alMostrar(el) {
      const autos = C.momentos.filter(m => m.auto);
      $("#res", el).innerHTML = `
        ${PROB.length ? `<section><h3>Mis conclusiones</h3><dl>${PROB.map(p => `<dt>${esc(p.titulo)}</dt><dd><b>Antes:</b> ${esc(R.prob[p.id].antes || "(sin escribir)")}<br><b>Ahora:</b> ${esc(R.prob[p.id].ahora || "(sin escribir)")}</dd>`).join("")}</dl></section>` : ""}
        ${DG ? `<section><h3>${esc(DG.voces.map(v => v.nombre).join(" y "))}</h3><p style="margin:0">${R.diag.op === null ? "Al inicio no elegiste. ¿Y ahora?" : esc((CI.diag || "Al inicio elegiste: {x}. ¿Y ahora?").replace("{x}", "«" + DG.opciones[R.diag.op] + "»"))}</p>
        <div class="grupo ui no-imp" role="group" aria-label="Mi elección ahora" id="res-diag">${botones(DG.opciones)}</div><p class="aviso" id="res-diag-msg" hidden aria-live="polite"></p></section>` : ""}
        ${ACTS.length ? `<section><h3>Mi práctica</h3><dl>${ACTS.map(r => {
          const e = r.partes.map(o => o.estado ? o.estado() : null).filter(Boolean).pop();
          return `<dt>${esc(r.a.corto || r.a.rotulo.split(" · ")[0])}</dt><dd>${estadoTxt(e)}${e && e.extra ? " · " + esc(e.extra) : ""}</dd>`; }).join("")}</dl></section>` : ""}
        ${TK.length ? `<section><h3>Mi ticket de salida</h3><p style="margin:0">${TK.map((t, i) => `${i + 1}: ${R.ticket[t.id] === undefined ? "sin responder" : LETRAS[R.ticket[t.id]] + (R.ticketVisto ? (R.ticket[t.id] === t.correcta ? " ✓" : " ↻") : "")}`).join(" · ")}</p></section>` : ""}
        ${autos.length ? `<section><h3>¿Cómo voy?</h3><dl>${autos.map(m => `<dt>${esc(m.nombre)}</dt><dd>${R.auto[m.id] === undefined ? "(sin marcar)" : esc((C.autoOpciones || TX.autoOpciones)[R.auto[m.id]])}</dd>`).join("")}</dl></section>` : ""}`;
      if (!DG) return;
      elegir($("#res-diag", el), v => {
        R.diagFinal = +v; const m = $("#res-diag-msg", el); m.hidden = false;
        m.textContent = (R.diag.op !== null && R.diag.op !== +v ? "Cambiaste de idea con evidencia: eso hace la ciencia. " : "") + DG.respuesta;
      });
      if (R.diagFinal !== null) { const b = $(`#res-diag [data-v="${R.diagFinal}"]`, el); if (b) b.setAttribute("aria-pressed", "true"); }
    } });

  /* ---------- Pantallas solo para el docente ---------- */
  const DOC = C.docente || {};
  const fuentes = [];
  SIM_IDS.forEach((id, i) => fuentes.push([`Simulador ${i + 1}`, SIMS[id]]));
  ACTS.forEach(r => r.a.partes.forEach(x => { const f = x.tipo === "sim" ? SIMS[x.sim] : x; if (f && f.cita) fuentes.push([r.a.corto || r.a.rotulo.split(" · ")[0], f]); }));
  pantalla({ id: "d-apoyo", m: "cierre", min: 0, soloDocente: true, rotulo: "Solo docente", titulo: "Tiempos, apoyos y plan B",
    html: () => `<div class="dos par ui"><div class="tabla-caja"><table><tr><th>Momento</th><th>Minutos</th></tr>${C.momentos.filter(m => m.min).map(m => `<tr><td>${esc(m.nombre)}</td><td class="num">${m.min}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="num"><b>${C.momentos.reduce((a, m) => a + m.min, 0)}</b></td></tr></table></div>
      <div><div class="tarjeta"><b>Apoyos (DUA y PIE)</b><ul style="margin:.2em 0;padding-left:1.2em">${(DOC.apoyos || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>
      <div class="tarjeta" style="margin-top:.6em"><b>Plan B</b><p style="margin:.2em 0 0">${esc(DOC.planB || "")}</p></div>
      <div class="tarjeta" style="margin-top:.6em"><b>Si proyectas la página</b><p style="margin:.2em 0 0">Cada estudiante responde en su guía; tú o un estudiante sorteado ingresa la respuesta del curso. Usa el conteo por alternativa en la bisagra y en el ticket.</p></div></div></div>` });
  if (fuentes.some(f => f[1].cita)) pantalla({ id: "d-fuentes", m: "cierre", min: 0, soloDocente: true, rotulo: "Solo docente", titulo: "Actividades emuladas y materiales",
    html: () => `<div class="tabla-caja ui" style="font-size:.8em"><table><tr><th>Dónde</th><th>Actividad original</th><th>Materiales para hacerla de verdad</th><th>Seguridad</th><th>¿Hacerla real?</th></tr>${fuentes.filter(f => f[1].cita).map(f => `<tr><td>${esc(f[0])}</td><td><a href="${esc(f[1].cita.url)}" target="_blank" rel="noopener">${esc(f[1].cita.titulo)}</a>, ${esc(f[1].cita.institucion)}</td><td>${esc(f[1].materiales || "")}</td><td>${esc(f[1].seguridad || "—")}</td><td>${esc(f[1].real || "")}</td></tr>`).join("")}</table></div>
      <p class="ui">Los dibujos, los textos y el código de los simuladores son propios: se emula el fenómeno y la estructura de cada actividad, sin copiar sus materiales.</p>` });
  pantalla({ id: "d-revisar", m: "cierre", min: 0, soloDocente: true, rotulo: "Solo docente", titulo: "Lo que debes revisar",
    html: () => `<ul class="ui" style="max-width:60em">${(DOC.supuestos || []).map(s => `<li>${esc(s)}</li>`).join("")}</ul>` });

  /* =====================================================================
     NAVEGACIÓN, AGENDA Y HERRAMIENTAS
     ===================================================================== */
  const app = $("#app"), escena = $("#escena"), agenda = $("#agenda");
  const MOMS = C.momentos.filter(m => SL.some(o => o.m === m.id && !o.soloDocente));
  /* La autoevaluación de cada momento va en su última pantalla, si ninguna la lleva ya */
  MOMS.filter(m => m.auto).forEach(m => {
    const suyas = SL.filter(o => o.m === m.id && !o.soloDocente && o.min !== 0 || (o.m === m.id && o.id === "tfin"));
    if (suyas.length && !suyas.some(o => o.auto === m.id || o.cierraMomento)) suyas[suyas.length - 1].auto = m.id;
  });
  /* Ruta de cada pantalla en los datos de la clase: es lo que se nombra al pedir un cambio (solo con clases del contrato) */
  const RUTAS = {};
  if (window.__contrato) {
    Object.assign(RUTAS, { portada: "clase.portada", haz1: "clase.haz", haz2: "clase.haz.diag", linea: "clase.linea", glosario: "clase.glosario", bisagra: "clase.bisagra", desafio: "clase.desafio", tfin: "clase.ticket", cierre: "clase.cierre" });
    (C.problemas || []).forEach(p => { RUTAS[p.id + "a"] = RUTAS[p.id + "d"] = `clase.problemas[${p.id}]`; });
    (C.simuladores || []).forEach(k => { RUTAS[k] = `clase.sims.${k}`; });
    (C.explicacion || []).forEach(e => { RUTAS[e.id] = `clase.explicacion[${e.id}]`; });
    [["guiada", C.guiada], ["independiente", C.independiente]].forEach(([m, l]) => (l || []).forEach(a => a.partes.forEach((x, k) => { const id = x.id || a.id + (a.partes.length > 1 ? "abcdef"[k] : ""); RUTAS[id] = `clase.${m}[${a.id}].partes[${x.id || k}]`; })));
    (C.ticket || []).forEach(q => { RUTAS[q.id] = `clase.ticket[${q.id}]`; });
  }
  SL.forEach(o => {
    const sec = document.createElement("section");
    sec.className = "slide " + (o.clase || ""); sec.id = "s-" + o.id; sec.dataset.m = o.m; sec.dataset.min = o.min;
    sec.setAttribute("aria-label", o.titulo || C.meta.titulo);
    sec.innerHTML = (o.rotulo ? `<p class="rotulo">${esc(o.rotulo)}</p>` : "") + (o.titulo ? `<h2>${esc(o.titulo)}</h2>` : "") + o.html() + (o.auto ? autoHTML(mom(o.auto)) : "") + (o.doc ? `<div class="doc"${RUTAS[o.id] ? ` data-ruta="${esc(RUTAS[o.id])}"` : ""}>${o.doc()}</div>` : "");
    if (RUTAS[o.id]) sec.dataset.ruta = RUTAS[o.id];
    escena.appendChild(sec); o.el = sec;
    if (o.init) o.init(sec);
    autoInit(sec);
  });
  agenda.innerHTML = MOMS.map(m => `<button type="button" data-m="${m.id}" style="--min:${Math.max(m.min, 4)}"><b>${esc(m.nombre)}</b>${m.min ? m.min + NB + "min" : "resumen"}</button>`).join("");

  let idx = 0, docente = false;
  const visibles = () => SL.filter(o => docente || !o.soloDocente);
  function mostrar(i) {
    const lista = visibles(); i = Math.max(0, Math.min(lista.length - 1, i));
    const previa = lista[idx] || SL[0], o = lista[i];
    if (previa && previa !== o && previa.alOcultar) previa.alOcultar(previa.el);
    idx = i;
    SL.forEach(x => x.el.classList.toggle("activa", x === o));
    if (o.alMostrar) o.alMostrar(o.el);
    o.el.scrollTop = 0;
    $$("button", agenda).forEach(b => b.setAttribute("aria-current", b.dataset.m === o.m ? "true" : "false"));
    $("#cont").textContent = `${i + 1} / ${lista.length}`;
    $("#ant").disabled = i === 0; $("#sig").disabled = i === lista.length - 1;
    relojCero(o.min);
    if (window.__alCambiar) window.__alCambiar(o.id);
  }
  function irA(id) { const i = visibles().findIndex(o => o.id === id); if (i >= 0) mostrar(i); }
  window.__irA = irA; window.__pantallas = () => visibles().map(o => o.id);
  $("#ant").addEventListener("click", () => mostrar(idx - 1));
  $("#sig").addEventListener("click", () => mostrar(idx + 1));
  agenda.addEventListener("click", e => { const b = e.target.closest("button[data-m]"); if (b) irA(SL.find(o => o.m === b.dataset.m).id); });

  /* Temporizador de la pantalla (solo docente) */
  let seg = 0, tic = 0;
  const reloj = $("#reloj"), relojPinta = () => { reloj.textContent = Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0"); };
  function relojCero(min) { clearInterval(tic); tic = 0; seg = Math.round((min || 0) * 60); relojPinta(); $("#reloj-ir").textContent = "Iniciar"; }
  $("#reloj-ir").addEventListener("click", e => {
    if (tic) { clearInterval(tic); tic = 0; e.currentTarget.textContent = "Seguir"; return; }
    e.currentTarget.textContent = "Pausar";
    tic = setInterval(() => { if (seg > 0) { seg--; relojPinta(); } else { clearInterval(tic); tic = 0; } }, 1000);
  });
  $("#reloj-cero").addEventListener("click", () => relojCero(visibles()[idx].min));

  /* Sorteo de número de lista sin repetir */
  let bolsa = [];
  const total = () => Math.max(1, Math.min(60, +$("#sorteo-total").value || C.meta.estudiantes || 40));
  $("#sorteo-total").value = C.meta.estudiantes || 40;
  $("#sortear").addEventListener("click", () => {
    const n = total();
    if (!bolsa.length || bolsa.total !== n) { bolsa = Array.from({ length: n }, (_, i) => i + 1); bolsa.total = n; }
    const k = Math.floor(Math.random() * bolsa.length);
    $("#sorteo-n").textContent = bolsa.splice(k, 1)[0];
  });

  /* Grupos al azar, por número de lista (sin nombres). Se muestran sobre la pantalla. */
  const panelG = $("#grupos"), tam = () => Math.max(2, Math.min(8, +$("#grupos-tam").value || 4));
  function mezclaGrupos() {
    const n = total(), t = tam(), nums = Array.from({ length: n }, (_, i) => i + 1);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)), x = nums[i]; nums[i] = nums[j]; nums[j] = x; }
    /* Los que sobran se reparten de a uno entre los primeros grupos: nadie queda solo */
    const cuantos = Math.max(1, Math.floor(n / t)), grupos = Array.from({ length: cuantos }, () => []);
    nums.forEach((x, i) => { if (i < cuantos * t) grupos[Math.floor(i / t)].push(x); else grupos[(i - cuantos * t) % cuantos].push(x); });
    $("#grupos-lista").innerHTML = grupos.map((g, i) => `<li><b>Grupo ${i + 1}</b><span>${g.sort((a, b) => a - b).join(" · ")}</span></li>`).join("");
    $("#grupos-tit").textContent = `${cuantos} grupos de ${t}${n % t && cuantos ? ` (${n % t >= cuantos ? "algunos" : n % t} con uno más)` : ""} · ${n} estudiantes`;
  }
  function verGrupos(si) { panelG.hidden = !si; $("#grupos-ir").setAttribute("aria-pressed", si); if (si) { mezclaGrupos(); $("#grupos-otra").focus(); } }
  $("#grupos-ir").addEventListener("click", () => verGrupos(panelG.hidden));
  $("#grupos-otra").addEventListener("click", mezclaGrupos);
  $("#grupos-tam").addEventListener("change", mezclaGrupos);
  $("#grupos-cerrar").addEventListener("click", () => { verGrupos(false); $("#grupos-ir").focus(); });

  /* Pizarra: el docente raya sobre la pantalla. Los trazos se guardan por pantalla mientras la página está abierta. */
  const piz = $("#pizarra"), lienzoP = $("#pizarra-cv"), ctxP = lienzoP.getContext("2d"), trazos = {};
  let herr = "lapiz", trazo = null;
  const propios = () => { const id = visibles()[idx].id; return trazos[id] || (trazos[id] = []); };
  function pintaPizarra() {
    const r = lienzoP.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2), w = Math.max(2, Math.round(r.width * d)), h = Math.max(2, Math.round(r.height * d));
    if (lienzoP.width !== w || lienzoP.height !== h) { lienzoP.width = w; lienzoP.height = h; }
    const cs = getComputedStyle(document.documentElement), tinta = cs.getPropertyValue("--tinta").trim() || "#232540", acc = cs.getPropertyValue("--accion").trim() || "#1273c4";
    ctxP.clearRect(0, 0, w, h); ctxP.lineCap = "round"; ctxP.lineJoin = "round";
    propios().forEach(t => {
      ctxP.globalAlpha = t.h === "destacador" ? 0.32 : 1; ctxP.strokeStyle = t.h === "destacador" ? acc : tinta; ctxP.lineWidth = (t.h === "destacador" ? 22 : 4.5) * d;
      ctxP.beginPath(); t.p.forEach((q, i) => { const x = q[0] * w, y = q[1] * h; if (i) ctxP.lineTo(x, y); else ctxP.moveTo(x, y); });
      if (t.p.length === 1) ctxP.lineTo(t.p[0][0] * w + 0.1, t.p[0][1] * h);
      ctxP.stroke();
    });
    ctxP.globalAlpha = 1;
  }
  function verPizarra(si) {
    piz.hidden = !si; app.classList.toggle("con-pizarra", si); $("#pizarra-ir").setAttribute("aria-pressed", si);
    if (si) { pintaPizarra(); $(`[data-h="${herr}"]`, piz).focus(); }
  }
  const punto = e => { const r = lienzoP.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  lienzoP.addEventListener("pointerdown", e => { trazo = { h: herr, p: [punto(e)] }; propios().push(trazo); try { lienzoP.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ } pintaPizarra(); });
  lienzoP.addEventListener("pointermove", e => { if (!trazo) return; trazo.p.push(punto(e)); pintaPizarra(); });
  ["pointerup", "pointercancel"].forEach(n => lienzoP.addEventListener(n, () => { trazo = null; }));
  piz.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.h) { herr = b.dataset.h; $$("[data-h]", piz).forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); }
    else if (b.id === "pizarra-atras") { propios().pop(); pintaPizarra(); }
    else if (b.id === "pizarra-limpia") { propios().length = 0; pintaPizarra(); }
    else if (b.id === "pizarra-cerrar") { verPizarra(false); $("#pizarra-ir").focus(); }
  });
  $("#pizarra-ir").addEventListener("click", () => verPizarra(piz.hidden));
  window.addEventListener("resize", () => { if (!piz.hidden) pintaPizarra(); });
  window.__alCambiar = () => { if (!piz.hidden) pintaPizarra(); };

  /* Estilo, tamaño de letra y modo docente */
  const ESTILOS = [["", "automático"], ["claro", "claro"], ["oscuro", "oscuro"], ["contraste", "alto contraste"]];
  let iEst = 0, escala = 1;
  function estilo() {
    iEst = (iEst + 1) % ESTILOS.length;
    if (ESTILOS[iEst][0]) document.documentElement.dataset.estilo = ESTILOS[iEst][0]; else delete document.documentElement.dataset.estilo;
    $("#estilo").textContent = "Estilo: " + ESTILOS[iEst][1];
    const o = visibles()[idx]; if (o.alMostrar) o.alMostrar(o.el);
    if (!piz.hidden) pintaPizarra();
  }
  function letra(d) { escala = Math.max(0.85, Math.min(1.4, +(escala + d).toFixed(2))); document.documentElement.style.setProperty("--escala", escala); }
  function modoDocente() {
    const id = visibles()[idx].id; docente = !docente;
    app.classList.toggle("docente", docente); $("#docente").setAttribute("aria-pressed", docente);
    if (!docente) { verPizarra(false); verGrupos(false); }
    const i = visibles().findIndex(o => o.id === id); mostrar(i < 0 ? visibles().length - 1 : i);
  }
  $("#estilo").addEventListener("click", estilo);
  $("#letra-mas").addEventListener("click", () => letra(0.1));
  $("#letra-menos").addEventListener("click", () => letra(-0.1));
  $("#docente").addEventListener("click", modoDocente);

  /* Teclado: las flechas cambian de pantalla solo si el foco no está en un control de la pantalla */
  document.addEventListener("keydown", e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const a = document.activeElement, escribe = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName), enControl = a && a !== document.body && (escena.contains(a) || piz.contains(a) || panelG.contains(a));
    if (e.key === "PageDown") { e.preventDefault(); mostrar(idx + 1); }
    else if (e.key === "PageUp") { e.preventDefault(); mostrar(idx - 1); }
    else if (e.key === "Escape") { if (!piz.hidden) verPizarra(false); else if (!panelG.hidden) verGrupos(false); else if (a && a.blur) a.blur(); }
    else if (!enControl && e.key === "ArrowRight") mostrar(idx + 1);
    else if (!enControl && e.key === "ArrowLeft") mostrar(idx - 1);
    else if (!escribe && (e.key === "d" || e.key === "D")) modoDocente();
    else if (!escribe && (e.key === "e" || e.key === "E")) estilo();
    else if (!escribe && docente && (e.key === "p" || e.key === "P")) verPizarra(piz.hidden);
  });

  mostrar(0);
  }

  /* Con los datos de una clase, la página es esa clase. Sin datos, abre el armador.
     Los datos llegan como contrato (JSON puro, en #s-clase) o como bloque del formato anterior (CLASE y DIBUJOS). */
  window.__arranca = arranca;
  const datos = document.getElementById("s-clase");
  if (datos) {
    try { const doc = JSON.parse(datos.textContent), av = [], r = Contrato.compila(doc, av); window.__contrato = doc; window.__avisosContrato = av; arranca(r.C, r.D); }
    catch (e) {
      window.__errorClase = e;
      const p = document.createElement("p"); p.className = "error-clase"; p.textContent = "Esta clase no se puede abrir: " + e.message + " Ábrela en el Reproductor de clases para ver el detalle.";
      document.body.appendChild(p); throw e;
    }
  }
  else if (typeof CLASE !== "undefined") { try { arranca(CLASE, typeof DIBUJOS !== "undefined" ? DIBUJOS : {}); } catch (e) { window.__errorClase = e; throw e; } }
  else if (typeof Armador === "function") Armador();
})();
</script>
