    const n0 = o.conPred ? 2 : 1;
    return `<p class="consigna" data-cuenta>${esc(s.consigna)}</p>
    <div class="tres" data-sim="${id}">
      <div>
        ${caja3dHTML(figDe(s))}<figure class="figura plano3d${d === TABLERO ? " tablero" : ""}">${d.svg(s)}</figure>
        <div class="lecturas" aria-live="polite"></div>
        <p class="nota-modelo">${esc(s.limite || "")}${s.cita ? ` Emula la actividad «${esc(s.cita.titulo)}», de ${esc(s.cita.institucion)}.` : ""}</p>
      </div>
      <div class="ui">
        ${o.conPred ? `<div class="e-pred">
          <b class="paso-t">1. ${esc(s.pred.pregunta)}</b>
          <div class="grupo" role="group" aria-label="Mi predicción">${botones(s.pred.opciones)}</div>
          <label for="${id}-porq">¿Por qué? (si quieres)</label><input type="text" id="${id}-porq" autocomplete="off">
          <div class="grupo"><button class="btn fuerte" type="button" data-a="pred">Guardar mi predicción</button></div>
          <p class="aviso m-pred" hidden aria-live="polite"></p>
        </div>` : ""}
        <div class="e-medir" ${o.conPred ? "hidden" : ""}>
          <p class="mi-pred" hidden></p>
          <b class="paso-t">${n0}. ${esc(s.control)}</b>
          <div class="grupo niveles" role="group" aria-label="Lo que puedes cambiar">${ctl}</div>
          <p class="espera" aria-live="polite"></p>
          <div class="grupo"><button class="btn fuerte" type="button" data-a="reg">Registrar medición</button><button class="btn" type="button" data-a="borrar">Borrar datos</button></div>
          <p class="aviso m-medir" hidden aria-live="polite"></p>
          <div class="grupo"><button class="btn fuerte" type="button" data-a="listo" hidden>Ya tengo mis datos</button></div>
        </div>
        ${o.conVisto ? `<div class="e-visto" hidden>
          <b class="paso-t">3. Lo que vi</b>
          <label for="${id}-visto">Completa con dos datos de tu tabla: «${esc(s.visto.inicio)}»</label>
          <textarea id="${id}-visto"></textarea>
          <div class="grupo"><button class="btn fuerte" type="button" data-a="visto">Guardar</button><button class="btn" type="button" data-a="volver">Volver a medir</button></div>
          <div class="aviso tras" hidden>
            <p><b class="tit">Una frase posible:</b> «${esc(s.visto.modelo)}»</p>
            ${criteriosHTML(id + "-v", s.visto.criterios, "Mi frase tiene:")}
            <p style="margin:.2em 0 0"><b class="tit cmp"></b></p>
            <div class="grupo cumplio" role="group" aria-label="¿Se cumplió mi predicción?">${botones(["Sí", "En parte", "No"])}</div>
          </div>
        </div>` : ""}
      </div>
      <div class="ui">
        <div class="tabla-caja"><table></table></div>
        <svg class="grafico" viewBox="0 0 300 150" role="img" aria-label="Gráfico de tus mediciones"></svg>
      </div>
    </div>`;
  }

  function simInit(el, id, o) {
    const s = SIMS[id], d = planoDe(s), raiz = $(`[data-sim="${id}"]`, el), svg = $(".figura svg", raiz);
    const st = R.sim[id] = { pred: null, porq: "", nivel: s.inicial, estable: true, filas: [], visto: "", cumplio: null };
    let act = Object.assign({}, s.niveles[s.inicial].v), raf = 0;
    const lect = $(".lecturas", raiz), esp = $(".espera", raiz), tabla = $("table", raiz), graf = $(".grafico", raiz);
    const mMedir = $(".m-medir", raiz), bListo = $('[data-a="listo"]', raiz);
    const decir = (p, t) => { p.hidden = !t; p.textContent = t || ""; };

    const c3 = $(".e3d-caja", raiz), v3 = c3 ? vista3d(c3, figDe(s), () => pinta(false)) : null;
    function pinta(moviendo) {
      const c = { nivel: st.nivel, boton: s.niveles[st.nivel].boton, moviendo };
      if (v3 && v3.tresD) v3.pinta(Object.assign({}, act), c); else d.pinta(svg, act, c, s);
    }
    function lecturas() {
      lect.innerHTML = s.columnas.map(c => `<span>${esc(c.nombre)}: <b>${valor(s.niveles[st.nivel].v[c.k], c)}</b></span>`).join("");
    }
    function irNivel(n) {
      if (n === st.nivel && st.estable) return;
      cancelAnimationFrame(raf);
      const desde = Object.assign({}, act), hasta = s.niveles[n].v, t0 = performance.now(), dur = sinMov() ? 0 : s.espera.ms;
      st.nivel = n; st.estable = false;
      $$("[data-n]", raiz).forEach(b => b.setAttribute("aria-pressed", +b.dataset.n === n ? "true" : "false"));
      esp.textContent = `Esperando… (en la vida real: ${s.espera.real})`;
      decir(mMedir, "");
      const paso = ahora => {
        const f = dur ? Math.min(1, (ahora - t0) / dur) : 1, k = 1 - Math.pow(1 - f, 3);
        Object.keys(hasta).forEach(key => { act[key] = desde[key] + (hasta[key] - desde[key]) * k; });
        pinta(f < 1);
        if (f < 1) { raf = requestAnimationFrame(paso); return; }
        act = Object.assign({}, hasta); st.estable = true; pinta(false); lecturas();
        esp.textContent = "Listo: los instrumentos se detuvieron.";
      };
      if (dur) raf = requestAnimationFrame(paso); else paso(t0);
    }
    function pintaTabla() {
      const cab = "<tr>" + s.columnas.map(c => `<th>${esc(c.nombre)} (${c.unidad})</th>`).join("") + "</tr>";
      const cuerpo = st.filas.length
        ? st.filas.map(f => "<tr>" + s.columnas.map(c => `<td class="num">${valor(f.v[c.k], c)}</td>`).join("") + "</tr>").join("")
        : `<tr><td class="vacia" colspan="${s.columnas.length}">Aquí aparecen tus mediciones.</td></tr>`;
      tabla.innerHTML = cab + cuerpo;
      pintaGrafico();
      bListo.hidden = st.filas.length < 3 || (!o.conVisto && !o.alListo);
      if (o.alCambiar) o.alCambiar(st);
    }
    function pintaGrafico() {
      const cx = s.columnas[0], cy = s.columnas[1], xs = s.niveles.map(n => n.v[cx.k]), ys = s.niveles.map(n => n.v[cy.k]);
      const x0 = Math.min.apply(0, xs), x1 = Math.max.apply(0, xs), y0 = Math.min.apply(0, ys), y1 = Math.max.apply(0, ys);
      const px = x => 46 + (x - x0) / ((x1 - x0) || 1) * 232, py = y => 112 - (y - y0) / ((y1 - y0) || 1) * 92;
      let g = `<path d="M40 12V120H288" fill="none" stroke="var(--tinta)" stroke-width="2"/>`;
      g += `<text x="46" y="134">${num(x0, cx.dec)}</text><text x="278" y="134" text-anchor="end">${num(x1, cx.dec)}</text>`;
      g += `<text x="36" y="116" text-anchor="end">${num(y0, cy.dec)}</text><text x="36" y="24" text-anchor="end">${num(y1, cy.dec)}</text>`;
      g += `<text x="164" y="146" text-anchor="middle">${esc(cx.nombre)} (${cx.unidad})</text>`;
      g += `<text x="46" y="10">${esc(cy.nombre)} (${cy.unidad})</text>`;
      st.filas.forEach(f => { g += `<circle cx="${px(f.v[cx.k])}" cy="${py(f.v[cy.k])}" r="6" fill="var(--accion)" stroke="var(--tinta)" stroke-width="2"/>`; });
      graf.innerHTML = g;
    }
    function foco() { const b = $('[data-n][aria-pressed="true"]', raiz) || $('[data-a="menos"]', raiz); if (b) b.focus(); }

    raiz.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.n !== undefined) { irNivel(+b.dataset.n); return; }
      const a = b.dataset.a;
      if (a === "menos") { if (st.nivel < s.niveles.length - 1) irNivel(st.nivel + 1); else decir(mMedir, s.pasos.tope || "Ya no se puede seguir. Vuelve al inicio para empezar de nuevo."); }
      else if (a === "reset") irNivel(0);
      else if (a === "pred") {
        const mp = $(".m-pred", raiz);
        if (st.pred === null) { decir(mp, `Elige una de las ${s.pred.opciones.length === 3 ? "tres " : ""}opciones. Es solo tu idea de ahora: no tiene nota.`); return; }
        st.porq = $(`#${id}-porq`, raiz).value.trim();
        $(".e-pred", raiz).hidden = true; $(".e-medir", raiz).hidden = false;
        const p = $(".mi-pred", raiz); p.hidden = false; p.innerHTML = `Tu predicción: <b>${esc(s.pred.opciones[st.pred])}</b>.`;
        foco();
      }
      else if (a === "reg") {
        if (!st.estable) { decir(mMedir, "Los instrumentos todavía se mueven. Espera a que se detengan y registra de nuevo."); foco(); return; }
        if (st.filas.some(f => f.n === st.nivel)) { decir(mMedir, "Esa medición ya está en tu tabla. Cambia el control y registra otra."); foco(); return; }
        st.filas.push({ n: st.nivel, v: Object.assign({}, s.niveles[st.nivel].v) });
        const k = s.columnas[0].k; st.filas.sort((p, q) => p.v[k] - q.v[k]);
        decir(mMedir, st.filas.length < 3 ? `Medición registrada. Llevas ${st.filas.length} de 3.` : "Ya tienes tres mediciones o más.");
        pintaTabla(); foco();
      }
      else if (a === "borrar") { st.filas = []; decir(mMedir, "Tabla vacía. Puedes medir de nuevo."); pintaTabla(); foco(); }
      else if (a === "listo") {
        if (o.conVisto) { $(".e-medir", raiz).hidden = true; $(".e-visto", raiz).hidden = false; $(`#${id}-visto`, raiz).focus(); }
        else if (o.alListo) o.alListo();
      }
      else if (a === "volver") { $(".e-visto", raiz).hidden = true; $(".e-medir", raiz).hidden = false; foco(); }
      else if (a === "visto") {
        st.visto = $(`#${id}-visto`, raiz).value.trim();
        const tras = $(".tras", raiz);
        if (!st.visto) { tras.hidden = true; return; }
        tras.hidden = false;
        $(".cmp", tras).textContent = st.pred === null ? "" : `Tu predicción fue «${s.pred.opciones[st.pred]}». ¿Se cumplió?`;
        $(".cumplio", tras).hidden = st.pred === null;
      }
    });
    if (o.conPred) elegir($(".e-pred .grupo", raiz), v => { st.pred = +v; decir($(".m-pred", raiz), ""); });
    if (o.conVisto) elegir($(".cumplio", raiz), v => { st.cumplio = +v; });
    pinta(false); lecturas(); pintaTabla();
    return v3;
  }
  const docSim = s => `<p><b>Modelo:</b> ${esc(s.modelo || "")} <b>Valores:</b> ${s.niveles.map(n => s.columnas.map(c => valor(n.v[c.k], c)).join(" → ")).join(" · ")}.</p>${s.cita ? `<p><b>Actividad real:</b> <a href="${esc(s.cita.url)}" target="_blank" rel="noopener">${esc(s.cita.titulo)}</a>, de ${esc(s.cita.institucion)}. ¿Conviene hacerla? ${esc(s.real || "")}</p>` : ""}`;

  /* Tabla con los datos de un simulador (para decidir con ellos en la pantalla siguiente) */
  function tablaDatos(id) {
    const s = SIMS[id], st = R.sim[id], propias = st && st.filas.length >= 3;

  }

  /* =====================================================================
     LAS PANTALLAS
     ===================================================================== */

  /* ---------- 1. Portada ---------- */
  const PC = C.portada && C.portada.caja;
  pantalla({ id: "portada", m: "portada", min: 1, clase: "portada",
    html: () => `<p class="rotulo">Clase N.º ${C.meta.numero} · ${esc(C.meta.asignatura)} · ${esc(C.meta.curso)}</p>
      <div class="dos hero"><div>
      <h1 class="${String(C.meta.titulo).length > 44 ? "muy-largo" : String(C.meta.titulo).length > 24 ? "largo" : ""}">${esc(C.meta.titulo)}</h1>

      <div class="tarjeta" style="max-width:40em"><b>Al final de la clase podré decir:</b>
        <ol class="criterios" data-cuenta>${C.criterios.map(c => `<li>${esc(c.texto)}</li>`).join("")}</ol></div>
      ${C.portada && C.portada.chips ? `<div class="grupo" style="margin-top:.8em;gap:.6em 1.6em">${C.portada.chips.map(chip).join("")}</div>` : ""}</div>
      ${PC ? `<div class="ui" id="hero-3d"><canvas class="sim e3d" id="hero-cv" tabindex="0" role="img" aria-label="${esc(PC.alt || "Modelo en tres dimensiones: partículas que se mueven dentro de una caja")}"></canvas>
        ${PC.deslizador ? `<label for="hero-r">${esc(PC.deslizador.etiqueta)}</label><input type="range" id="hero-r" min="${PC.deslizador.min}" max="${PC.deslizador.max}" step="${PC.deslizador.paso}" value="${PC.deslizador.valor}">
        <div class="lecturas" aria-live="polite">${(PC.lecturas || []).map((l, i) => `<span>${l.var ? chip(l.var) : esc(l.nombre || "")} <b id="hero-l${i}"></b></span>`).join("")}</div>` : ""}
        ${ctl3d()}<p class="nota-modelo">${esc(PC.nota || "")}</p></div>` : figDe(C.portada) ? figuraHTML(figDe(C.portada), "media") : ""}</div>`,
    init(el) {
      if (!PC) { if (figDe(C.portada)) this.v3 = fijo3dInit(el, figDe(C.portada)); else $(".hero", el).classList.remove("dos"); return; }
      const e3 = Escena3D($("#hero-cv", el), { N: PC.N || 70, V: PC.V, Vmax: PC.Vmax || PC.V, T: PC.T || 300 });
      if (!e3) { $("#hero-3d", el).hidden = true; $(".hero", el).classList.remove("dos"); return; }

        $("#hero-r", el).addEventListener("input", lee); lee();
      }
      ctl3dInit(el, e3);
    },
    alMostrar() { if (this.e3) { this.e3.tema(); this.e3.ver(true); } if (this.v3) this.v3.mostrar(); }, alOcultar() { if (this.e3) this.e3.ver(false); if (this.v3) this.v3.ocultar(); },
    doc: () => `<p><b>${esc(C.meta.oaCodigo)}</b>${C.meta.oaTema ? ` (${esc(C.meta.oaTema)})` : ""}. ${C.meta.oaTexto ? esc(C.meta.oaTexto) : "VERIFICAR: copia el texto literal del OA desde tu planificación."}</p>
      <p><b>Objetivo de la clase:</b> ${esc(C.meta.objetivo)}</p>
      <p><b>Habilidad:</b> ${esc(C.meta.habilidad || "")}.${C.meta.pasosHabilidad ? ` Pasos: ${C.meta.pasosHabilidad.map((p, i) => `${i + 1}) ${esc(p)}`).join(" ")}` : ""} <b>Actitud:</b> ${esc(C.meta.actitud || "")}</p>
      <p>Teclas: ← → o AvPág y RePág cambian de pantalla · D activa este modo · E cambia el estilo · P abre la pizarra. Con el modo docente aparecen las notas, las respuestas, el temporizador, el sorteo, los grupos, la pizarra y tres pantallas ocultas al final.</p>` });

  /* ---------- 2. Haz ahora ---------- */
  const HZ = C.haz;
  if (HZ && hay(HZ.preguntas)) pantalla({ id: "haz1", m: "haz", min: HZ.min || 3, rotulo: "Haz ahora · recordar", titulo: HZ.titulo || "¿Qué recuerdas?",
    html: () => `<p class="tx" data-cuenta>${esc(HZ.consigna)}</p>
      ${HZ.preguntas.map((p, i) => `<div class="preg ui" data-p="${p.id}"><p data-cuenta>${i + 1}. ${esc(p.texto)}</p><div class="grupo" role="group" aria-label="Pregunta ${i + 1}">${botones(p.opciones)}</div><p class="retro" hidden></p></div>`).join("")}
      <div class="grupo ui"><button class="btn fuerte" type="button" id="haz-ok">Comprobar</button><span id="haz-msg" aria-live="polite"></span></div>`,
    doc: () => `<p>Respuestas: ${HZ.preguntas.map((p, i) => `${i + 1}) ${esc(p.opciones[p.correcta])}`).join(" ")} ${esc(HZ.docente || "")}</p><p>Primer intento sin nota. «Comprobar» responde recién cuando están todas las preguntas marcadas.</p>`,
    init(el) {
      HZ.preguntas.forEach(p => elegir($(`[data-p="${p.id}"] .grupo`, el), v => { R.haz[p.id] = +v; $(`[data-p="${p.id}"] .retro`, el).hidden = true; }));

        msg.textContent = ""; R.hazVisto = true;

          const r = $(`[data-p="${p.id}"] .retro`, el), i = R.haz[p.id], bien = i === p.correcta;

  /* Dos voces: una idea previa frecuente y la idea de la clase. No se corrige hasta el final. */
  const DG = HZ && HZ.diag;
  if (DG) pantalla({ id: "haz2", m: "haz", min: DG.min || 3, rotulo: "Haz ahora · tu idea de hoy", titulo: DG.titulo, auto: "haz",
    html: () => `<div class="fila" data-cuenta>${DG.voces.map(v => `

    doc: () => `<p>No corrijas todavía. ${esc(DG.docente || "")} La página vuelve a esta pregunta en «Mi clase de hoy».</p>${conteoHTML("diag", DG.opciones.length)}`,

  /* ---------- 3A. Problemas de la vida cotidiana: aquí no se corrige ---------- */
