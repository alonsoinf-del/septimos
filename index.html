/* Layout: marco azul; arriba, la agenda como pista de tiempo (cada tramo mide lo que dura su momento);
   al centro, una pantalla con una sola función; abajo, la barra para avanzar. En teléfono todo pasa a una columna. */

  --telon:#1273c4;
  --telon-tinta:#ffffff;
  --chip:rgba(0,0,0,.2);
  --chip-b:transparent;
  --fondo:#e6f3fd;
  --papel:#ffffff;
  --tinta:#232540;
  --tinta-2:#565a78;
  --linea:#232540;
  --suave:#eef6ff;
  --borde-btn:#9db8d8;
  --borde-suave:#cfe2f5;
  --accion:#1273c4;
  --accion-2:#0c569a;
  --sobre-accion:#ffffff;
  --p:#f2655a;
  --sobre-p:#232540;
  --v:#a78bfa;
  --sobre-v:#232540;
  --t:#ffcb3d;
  --sobre-t:#232540;
  --ok:#14804a;
  --sobre-ok:#ffffff;
  --agua:#7cc8f5;
  --liq:#1273c4;
  --part:#17968f;
  --resalte:#ffffff;
  --sobre-resalte:#232540;
  --sombra-caja:0 4px 0 rgba(18,60,110,.13);
  --f-titulo:"Fredoka","Trebuchet MS","Verdana",sans-serif;
  --f-texto:"Andika","Verdana","Segoe UI",sans-serif;
  --f-dato:"JetBrains Mono","Consolas","Courier New",monospace;
  --escala:1;
}

  --telon-tinta:#ffffff;
  --chip:#000000;
  --chip-b:#ffffff;
  --fondo:#000000;
  --papel:#000000;
  --tinta:#ffffff;
  --tinta-2:#ffffff;
  --linea:#ffffff;
  --suave:#000000;
  --borde-btn:#ffffff;
  --borde-suave:#ffffff;
  --accion:#ffe600;
  --accion-2:#ffe600;
  --sobre-accion:#000000;
  --p:#ff8a80;
  --sobre-p:#000000;
  --v:#c4b5fd;
  --sobre-v:#000000;
  --t:#ffe600;
  --sobre-t:#000000;
  --ok:#7dff8a;
  --sobre-ok:#000000;
  --agua:#000000;
  --liq:#ffffff;
  --part:#7dff8a;
  --resalte:#ffe600;
  --sobre-resalte:#000000;
  --sombra-caja:none;
  color-scheme:dark;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--telon);color:var(--tinta);font-family:var(--f-texto);line-height:1.35}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accion);text-underline-offset:.15em}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
.agenda :focus-visible,.barra :focus-visible{outline-color:var(--t)}
.app{height:100%;min-height:0;display:flex;flex-direction:column}

/* Agenda: cada tramo crece según sus minutos */
.agenda{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 16px 4px}
.agenda button{flex:var(--min) 1 0;min-width:max-content;background:var(--chip);color:var(--telon-tinta);border:2px solid var(--chip-b);border-radius:12px;padding:3px 10px 4px;text-align:left;font-size:13px;line-height:1.2;white-space:nowrap}
.agenda button b{display:block;font-family:var(--f-titulo);font-weight:600;font-size:14px}
.agenda button[aria-current="true"]{background:var(--resalte);color:var(--sobre-resalte);border-color:var(--resalte)}

/* Pantalla */
.escena{flex:1;min-height:0;display:flex;padding:6px 16px 8px;font-size:calc(clamp(15px,.68vw + .68vh + 5px,28px) * var(--escala))}
.slide{display:none;flex:1;min-width:0;overflow:auto;width:100%;max-width:1560px;margin:0 auto;background:var(--fondo);color:var(--tinta);border:5px solid var(--papel);border-radius:26px;padding:clamp(12px,1.3vw,22px) clamp(14px,2vw,32px)}
.slide.activa{display:block}
:root[data-estilo="contraste"] .slide{border-color:var(--tinta)}
h1,h2,h3{font-family:var(--f-titulo);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h2{display:block;width:fit-content;max-width:100%;font-size:1.3em;background:var(--accion);color:var(--sobre-accion);padding:.14em .7em .2em;border-radius:.75em;margin:0 0 .45em}
p{margin:0 0 .5em}
.rotulo{display:block;width:fit-content;background:var(--papel);color:var(--tinta);border:2px solid var(--borde-btn);font-family:var(--f-titulo);font-weight:600;font-size:.7em;padding:.1em .8em;border-radius:99px;margin:0 0 .4em}
.tx{background:var(--papel);border-radius:16px;padding:.4em .8em;box-shadow:var(--sombra-caja);max-width:38em;width:fit-content;margin:0 0 .5em}
.tx.grande{font-size:1.12em}
.tarjeta{background:var(--papel);border:3px solid var(--borde-suave);border-radius:18px;padding:.5em .8em;box-shadow:var(--sombra-caja)}
.tarjeta>b:first-child{font-family:var(--f-titulo);font-weight:600}
.fila{display:grid;gap:.8em;grid-template-columns:repeat(auto-fit,minmax(min(100%,14em),1fr));margin:.5em 0}
.dos{display:grid;gap:.8em 1.2em;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.dos.par{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tres{display:grid;gap:.7em 1em;grid-template-columns:minmax(0,1.05fr) minmax(0,1.1fr) minmax(0,.9fr);align-items:start}
@media (max-width:1000px){.tres{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tres>:last-child{grid-column:1/-1}}
@media (max-width:760px){.dos,.dos.par,.tres{grid-template-columns:minmax(0,1fr)}.tres>:last-child{grid-column:auto}}

/* Las tres variables: letra, forma y color */
.var{display:inline-flex;align-items:center;gap:.35em;font-family:var(--f-titulo);font-weight:700;white-space:nowrap}
.var i{font-style:normal;display:inline-grid;place-items:center;flex:none;width:1.6em;height:1.6em;font-size:.8em;border:2.5px solid var(--linea);background:var(--c);color:var(--sc)}
.var.p{--c:var(--p);--sc:var(--sobre-p)} .var.p i{border-radius:50%}
.var.v{--c:var(--v);--sc:var(--sobre-v)} .var.v i{border-radius:.25em}
.var.t{--c:var(--t);--sc:var(--sobre-t)} .var.t i{border-radius:.25em;transform:rotate(45deg) scale(.84);margin:0 .1em} .var.t i span{transform:rotate(-45deg)}
.var.n{--c:var(--papel);--sc:var(--tinta)} .var.n i{border-radius:.25em .9em}
.rol{display:inline-block;font-family:var(--f-titulo);font-weight:700;background:var(--accion);color:var(--sobre-accion);border-radius:10px;padding:.02em .45em;min-width:2.3em;text-align:center}

/* Botones y campos */
.btn{background:var(--papel);color:var(--tinta);font-family:var(--f-titulo);font-weight:600;border:2.5px solid var(--borde-btn);border-bottom-width:5px;border-radius:14px;padding:.22em .75em;min-height:40px;text-align:left}
.btn:active{transform:translateY(2px)}
.btn.fuerte,.btn[aria-pressed="true"]{background:var(--accion);color:var(--sobre-accion);border-color:var(--accion-2)}
.btn[aria-pressed="true"]::before{content:"● "}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grupo{display:flex;flex-wrap:wrap;gap:.45em;margin:.3em 0 .5em;align-items:center}
.grupo.col{flex-direction:column;align-items:stretch}
.ui{font-size:.88em}
.ui label,.et-campo{display:block;font-family:var(--f-titulo);font-weight:600;margin:.3em 0 .15em}
textarea,input[type=text],select{width:100%;background:var(--papel);color:var(--tinta);border:2.5px solid var(--borde-btn);border-radius:12px;padding:.3em .55em}
textarea{resize:vertical;min-height:3.2em;display:block}
.e-visto textarea,#mi-txt{min-height:2.7em}
select{width:auto;max-width:100%;min-height:40px}
.aviso{border:3px dashed var(--accion);border-radius:16px;padding:.35em .7em;background:var(--papel);margin:.35em 0}
.aviso p{margin:0 0 .25em}
.aviso .grupo{margin:.15em 0 0}
.aviso b.tit{font-family:var(--f-titulo)}
.marca{display:inline-block;font-family:var(--f-titulo);font-weight:700;background:var(--papel);border:2px solid var(--borde-btn);border-radius:99px;padding:.02em .6em;white-space:nowrap}
.marca.bien{color:var(--ok);border-color:var(--ok)}
.marca.revisa{color:var(--tinta);border-style:dashed}
.marca:empty{display:none}
.ui label.chk,.chk{display:flex;gap:.45em;align-items:flex-start;margin:.1em 0;font-family:var(--f-texto);font-weight:400}
.chks{display:flex;flex-wrap:wrap;gap:.1em 1.2em}
.chk input{width:1.2em;height:1.2em;margin-top:.12em;flex:none;accent-color:var(--accion)}

/* Tablas */
.tabla-caja{overflow-x:auto;margin:.4em 0}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9em;background:var(--papel);border:3px solid var(--borde-btn);border-radius:16px;overflow:hidden}
th,td{padding:.25em .6em;text-align:left;vertical-align:middle;border-bottom:2px solid var(--borde-suave)}
tr:last-child td{border-bottom:0}
td+td,th+th{border-left:2px solid var(--borde-suave)}
th{background:var(--accion);color:var(--sobre-accion);font-family:var(--f-titulo);font-weight:600;font-size:.86em}
:root[data-estilo="contraste"] th{background:var(--papel);color:var(--tinta);border-bottom-width:4px}
td.num{font-family:var(--f-dato);font-variant-numeric:tabular-nums;white-space:nowrap}
td.vacia{color:var(--tinta-2);font-style:italic}

/* Figuras hechas con SVG */
.figura{margin:0;background:var(--papel);border:4px solid var(--borde-btn);border-radius:20px;padding:.3em;position:relative}
.figura svg{display:block;width:100%;height:auto;max-height:41vh;overflow:visible}
.figura.chica{max-width:15em}
.figura.media{max-width:20em}
.et{font:600 15px var(--f-titulo);fill:var(--tinta)}
.et.ch{font:600 12px var(--f-titulo);fill:var(--tinta-2)}
.et.dato{font:700 16px var(--f-dato)}
canvas.sim{display:block;width:100%;aspect-ratio:16/10;background:var(--papel);border:4px solid var(--borde-btn);border-radius:20px}
.nota-modelo{font-size:.66em;color:var(--tinta-2);margin:.35em 0 0}
.lecturas{display:flex;flex-wrap:wrap;gap:.3em .5em;margin:.35em 0 0;font-size:.8em}
.lecturas span{background:var(--papel);border:2px solid var(--borde-suave);border-radius:10px;padding:.05em .5em}
.lecturas b{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.consigna{background:var(--papel);border-radius:14px;padding:.35em .7em;box-shadow:var(--sombra-caja);margin:0 0 .5em;max-width:46em;width:fit-content}
.paso-t{display:block;font-family:var(--f-titulo);font-weight:700;margin:.1em 0 .2em}
.espera{font-family:var(--f-dato);font-size:.85em;margin:.2em 0;min-height:1.4em}
svg.grafico{display:block;width:100%;height:auto;background:var(--papel);border:3px solid var(--borde-btn);border-radius:16px;margin-top:.4em}
.grafico text{font:600 11px var(--f-titulo);fill:var(--tinta)}

/* Personajes */
.voz{display:grid;grid-template-columns:auto 1fr;gap:.8em;align-items:center}
.cara{width:3.4em;height:3.4em}
.globo-txt{position:relative;background:var(--papel);border:3px solid var(--borde-suave);border-radius:18px;padding:.4em .8em .5em;box-shadow:var(--sombra-caja)}
.globo-txt b{display:block;font-family:var(--f-titulo);font-weight:600;font-size:.76em}

/* Preguntas */
.preg{background:var(--papel);border-radius:16px;padding:.4em .8em .5em;box-shadow:var(--sombra-caja);margin:0 0 .55em;max-width:52em}
.preg>p{margin:0 0 .2em;font-weight:700}
.preg .grupo{margin:.2em 0 .1em}
.preg .retro{margin:.2em 0 0;font-size:.92em}
.opciones{display:grid;gap:.5em;margin:.5em 0;max-width:40em}
.opciones .btn{display:grid;grid-template-columns:auto 1fr;gap:.6em;align-items:center;font-family:var(--f-texto);font-weight:400}
.opciones .btn::before{content:none}
.opciones .letra{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--accion);color:var(--sobre-accion);font-family:var(--f-titulo);font-weight:700}
.opciones .btn[aria-pressed="true"] .letra{background:var(--sobre-accion);color:var(--accion)}
.opciones .retro{grid-column:2;font-size:.9em;margin:0}
.opciones .btn.es-correcta{border-color:var(--ok);border-style:solid}
.comprueba{background:var(--papel);border:3px dashed var(--accion);border-radius:16px;padding:.4em .8em .5em;max-width:40em}
.comprueba .tit{display:block;font-family:var(--f-titulo);font-weight:700}
.comprueba .btn{font-family:var(--f-texto);font-weight:400;min-height:0}
.comprueba .resp{margin:.3em 0 0;font-weight:700}

/* Autoevaluación de cada momento */
.auto{display:flex;flex-wrap:wrap;gap:.3em .7em;align-items:center;margin:.7em 0 0;padding:.35em .7em;background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;font-size:.84em;width:fit-content;max-width:100%}
.auto b{font-family:var(--f-titulo)}
.auto .grupo{margin:0}
.auto .btn{min-height:34px;padding:.05em .6em;border-bottom-width:3px}

/* Decidir VI, VD y VC */
.dec-fila{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2em .6em;align-items:center;background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;padding:.35em .6em;margin:0 0 .4em}
.dec-fila .grupo{margin:0}
.dec-fila .cuerpo{display:grid;grid-template-columns:minmax(0,1fr);gap:.25em;min-width:0}
.dec-fila select{flex:1 1 10em;min-width:0;width:10em}
.dec-fila .marca{white-space:normal;border-radius:12px}
.dec-fila .linea{display:flex;flex-wrap:wrap;gap:.3em .5em;align-items:center}
.dec-fila .ayuda{font-size:.9em;margin:0;color:var(--tinta-2)}
.pasos-g{display:grid;gap:.45em}
.paso-g{background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;padding:.35em .65em}
.paso-g .grupo{margin:.2em 0}
.paso-g .resuelto{margin:.2em 0 0;font-size:.94em}
.aer{display:grid;gap:.35em}
.aer p{margin:0;background:var(--papel);border:2px solid var(--borde-suave);border-radius:12px;padding:.3em .6em}
.aer b{font-family:var(--f-titulo)}
.antes{background:var(--papel);border:2px dashed var(--borde-btn);border-radius:14px;padding:.35em .65em;margin:0 0 .5em}
.antes b{display:block;font-family:var(--f-titulo);font-size:.84em}
.plan-fila{display:flex;flex-wrap:wrap;gap:.2em .6em;align-items:center;margin:.15em 0}
.plan-fila .frase{font-family:var(--f-titulo);font-weight:600}
.plan-fila.plan .frase{flex:0 0 100%}
.plan-fila .grupo{margin:0}
.resumen dl{margin:0;display:grid;grid-template-columns:minmax(8em,auto) 1fr;gap:.25em .8em}
.resumen dt{font-family:var(--f-titulo);font-weight:600}
.resumen dd{margin:0}
.resumen h3{font-size:1em;margin:.6em 0 .2em}
.portada h1{font-size:clamp(34px,6vw,84px);margin:.05em 0 .2em}
/* Títulos largos: la letra baja para que la portada siga cabiendo */
.portada h1.largo{font-size:clamp(30px,4.2vw,60px)}
.portada h1.muy-largo{font-size:clamp(26px,3.2vw,46px)}
.criterios{margin:.3em 0 0;padding-left:1.3em}
.criterios li{margin:.15em 0}

/* Solo docente */
.doc{display:none;margin-top:.7em;padding:.5em .7em;border:2px dashed var(--tinta-2);border-radius:14px;font-size:.72em;background:var(--papel)}
.doc::before{content:"Solo docente";display:block;font-weight:700;color:var(--tinta-2);margin-bottom:.2em}
.doc[data-ruta]::before{content:"Solo docente · para pedir un cambio: " attr(data-ruta)}
.doc p{margin:0 0 .3em} .doc ul{margin:.2em 0 .3em;padding-left:1.2em}
.app.docente .doc{display:block}
.barra .bloque.doc-solo{display:none}
.app.docente .barra .bloque.doc-solo{display:flex}
.conteo{display:flex;flex-wrap:wrap;gap:.3em .9em;align-items:center;margin:.3em 0}
.conteo span{display:inline-flex;align-items:center;gap:.25em}
.conteo output{font-family:var(--f-dato);font-weight:700;min-width:2ch;text-align:center}
.conteo .btn{min-height:30px;padding:0 .5em;border-bottom-width:3px}

/* Barra inferior */
.barra{flex:none;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:4px 16px 8px;color:var(--telon-tinta);font-size:14px}
.barra .bloque{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.barra .btn{padding:3px 10px;font-size:14px;min-height:36px;background:var(--chip);color:var(--telon-tinta);border:2px solid var(--chip-b)}
.barra .btn::before{content:none}
.barra .btn.fuerte,.barra .btn[aria-pressed="true"]{background:var(--resalte);color:var(--sobre-resalte);border-color:var(--resalte)}
.barra .et-b{font-size:12px;font-weight:700;opacity:.85}
.barra .empuja{margin-left:auto}
#reloj,#sorteo-n,.contador{font-family:var(--f-dato);font-weight:700;font-variant-numeric:tabular-nums}
#reloj{font-size:18px;min-width:4.4ch;text-align:center}
#sorteo-n{font-size:18px;min-width:2.4ch;text-align:center}
#sorteo-total,#grupos-tam{width:4em;background:var(--chip);color:var(--telon-tinta);border:2px solid var(--telon-tinta);border-radius:10px;padding:2px 4px;font-family:var(--f-dato)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  html,body{height:auto}
  body{background:#fff}
  .agenda,.barra,.slide:not(.imprime),.no-imp{display:none!important}
  .app{height:auto;display:block}
  .escena{display:block;padding:0;font-size:13px}
  .slide.imprime{display:block!important;border:0;background:#fff;color:#000;overflow:visible;padding:0}
}

.slide.densa{font-size:.92em}
.fila.tres-c{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.fila.tres-c{grid-template-columns:minmax(0,1fr)}}
.resumen #res{columns:2 26em;column-gap:2.2em}
.resumen #res section{break-inside:avoid;margin:0 0 .5em}
.resumen #res h3{margin-top:0}

.dec-fila.lista .ayuda{display:none}
.resumen dd{margin:0 0 .1em}
.etapa-plan{background:var(--papel);border:2px solid var(--borde-suave);border-radius:12px;padding:.25em .6em;margin:0 0 .4em;font-size:.92em}
.etapa-plan p{margin:0}
#i1-t .marca{white-space:normal;border-radius:12px}
#i1-t select{max-width:11em}

/* Línea de tiempo: el eje está a escala (cada año ocupa lo mismo); debajo, un botón por hito y una sola tarjeta a la vista */
.lt-eje{display:block;width:100%;height:auto;max-height:5.2em}
.lt-eje text{font:700 13px var(--f-dato);fill:var(--tinta)}
.lt-eje text.siglo{font:600 12px var(--f-titulo);fill:var(--tinta-2)}
.lt-botones{display:flex;flex-wrap:wrap;gap:.35em;margin:.2em 0 .5em}
.lt-botones .btn{min-height:36px;padding:.05em .55em;border-bottom-width:3px;font-size:.9em}
.lt-botones .btn b{font-family:var(--f-dato)}
.lt-tarjeta{display:grid;grid-template-columns:minmax(0,1fr) minmax(7em,10.5em);gap:.4em 1em;align-items:center}
.lt-tarjeta h3{font-size:1.15em}
.lt-tarjeta .donde{font-family:var(--f-dato);font-size:.82em;color:var(--tinta-2);margin:0 0 .3em}
.lt-tarjeta p{margin:0 0 .3em}
.lt-tarjeta .hoy{font-family:var(--f-titulo);font-weight:600;margin:0}
.lt-tarjeta .figura{border-width:3px}
@media (max-width:560px){.lt-tarjeta{grid-template-columns:minmax(0,1fr)}.lt-tarjeta .figura{max-width:11em}}

/* Escenas en 3D: el estudiante gira la vista; nada gira solo */
canvas.e3d{touch-action:pan-y;cursor:grab}
canvas.e3d:active{cursor:grabbing}
.e3d-caja .lienzo{position:relative}
.e3d-caja canvas.sim{aspect-ratio:4/3;max-height:41vh}
.tres .e3d-caja canvas.sim{max-height:38vh}
.vista3d.media{max-width:30em}
.vista3d.media .e3d-caja canvas.sim{max-height:44vh}
/* Con la escena 3D a la vista, los valores van en sus rótulos: la fila de lecturas queda solo para lectores de pantalla */
.figura.tablero:not([hidden])~.lecturas,.e3d-caja:not([hidden])~.lecturas{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rotulos{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px}
.rot3d{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:600 .62em/1.25 var(--f-titulo);color:var(--tinta);background:var(--papel);border:2px solid var(--borde-suave);border-radius:9px;padding:0 .4em}
.rot3d b{font-family:var(--f-dato);font-variant-numeric:tabular-nums}
.est3d{margin:.3em 0 0}
.c3d{margin:.3em 0 0}
.c3d .btn{min-height:34px;padding:.02em .6em;border-bottom-width:3px;font-size:.9em}
.dos.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center}
@media (max-width:760px){.dos.hero{grid-template-columns:minmax(0,1fr)}}
input[type=range]{width:100%;accent-color:var(--accion);min-height:32px;margin:0}
.lecturas .var{font-size:.95em}
.vista3d.media .plano3d{max-width:20em}

/* Herramientas del docente sobre la pantalla: pizarra y grupos */
.escena{position:relative}
.pizarra,.panel-g{position:absolute;inset:6px 16px 8px;max-width:1560px;margin:0 auto;border-radius:26px}
.pizarra{z-index:5;overflow:hidden;outline:4px dashed var(--resalte);outline-offset:-4px}
.pizarra canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pz-barra{position:absolute;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;background:var(--papel);border:3px solid var(--borde-btn);border-radius:16px;padding:5px}
.pz-barra .btn,.panel-g .cab .btn{min-height:36px;padding:2px 10px;font-size:15px}
.panel-g{z-index:6;background:var(--fondo);color:var(--tinta);border:5px solid var(--papel);padding:14px 22px;overflow:auto}
:root[data-estilo="contraste"] .panel-g{border-color:var(--tinta)}
.panel-g .cab{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.panel-g .cab b{font:700 1.25em var(--f-titulo);margin-right:auto}
.panel-g ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(13.5em,1fr));gap:10px}
.panel-g li{background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;padding:.25em .6em;display:grid}
.panel-g li b{font-family:var(--f-titulo)}
.panel-g li span{font-family:var(--f-dato);font-variant-numeric:tabular-nums;font-size:1.12em}
.barra input[type=number]{width:3.2em}
.barra{gap:6px 9px}
@media print{.pizarra,.panel-g{display:none!important}}
/* Ordenar una secuencia */
.orden{list-style:none;margin:0 0 .5em;padding:0;counter-reset:o;display:grid;gap:.3em}
.orden li{counter-increment:o;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:.5em;align-items:center;background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;padding:.25em .55em}
.orden li::before{content:counter(o);font:700 .9em var(--f-titulo);background:var(--accion);color:var(--sobre-accion);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center}
.orden .grupo{margin:0;flex-wrap:nowrap}
.orden .btn{min-height:34px;padding:0 .7em}

/* Armador: la página sin clase */
#armador{height:100%;overflow:auto;padding:18px 16px 40px}
.arm{max-width:62em;margin:0 auto;background:var(--fondo);color:var(--tinta);border:5px solid var(--papel);border-radius:26px;padding:clamp(14px,2.4vw,30px);font-size:clamp(16px,.5vw + 13px,20px)}
.arm h1{font:700 1.7em var(--f-titulo);margin:0 0 .3em}
.arm .tx{background:var(--papel);border-radius:14px;padding:.4em .7em;margin:0 0 .8em;max-width:46em}
.arm-pasos{margin:0;padding-left:1.4em;display:grid;gap:1em}
.arm-pasos>li::marker{font:700 1.2em var(--f-titulo)}
.arm textarea{width:100%;min-height:9em;font-family:var(--f-dato);font-size:.8em;margin:.3em 0}
.arm code{font-family:var(--f-dato);background:var(--papel);border-radius:6px;padding:0 .3em}
.arm .oculto{position:absolute;width:1px;height:1px;opacity:0}
.arm-inf{background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;padding:.5em .8em;margin:.4em 0;max-height:22em;overflow:auto}
.arm-inf h3{font:700 1em var(--f-titulo);margin:.5em 0 .2em}
.arm-inf h3:first-child{margin-top:0}
.arm-inf ul{list-style:none;margin:0;padding:0;display:grid;gap:.25em}
.arm-inf li{display:grid;grid-template-columns:1.4em 1fr;font-size:.92em}
.arm-inf li span{font-weight:700}
.arm-inf .mal span{color:var(--tinta)} .arm-inf h3.mal::before{content:"✗ "} .arm-inf h3.ojo::before{content:"! "} .arm-inf h3.bien::before{content:"✓ "}
.arm-inf .vacio{margin:0;color:var(--tinta-2);font-style:italic}
#arm-marco iframe{width:100%;aspect-ratio:16/9;border:4px solid var(--borde-btn);border-radius:16px;background:var(--telon);margin-top:.5em}
#arm-nom{font-family:var(--f-dato);font-size:.85em}

.error-clase{max-width:60ch;margin:15vh auto;padding:20px 24px;border:3px solid var(--linea);border-radius:14px;background:var(--papel);color:var(--tinta);font:700 1.15rem/1.45 var(--f-texto,sans-serif)}
.arm details{background:var(--papel);border:2px solid var(--borde-suave);border-radius:14px;padding:.4em .8em;margin:.5em 0}
.arm summary{font-weight:700;cursor:pointer}
.arm details p{margin:.4em 0}
.arm-parche textarea{min-height:6em}
#arm-cambios p{margin:.4em 0;font-weight:700}
#arm-rutas{max-height:16em;overflow:auto}
#arm-rutas table{border-collapse:collapse;width:100%;font-size:.85em}
#arm-rutas td{padding:.15em .5em .15em 0;vertical-align:top;border-bottom:1px solid var(--borde-suave)}
</style>
</head>
<body>
<template id="cascaron">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="c-ana" viewBox="0 0 64 64"><g stroke="#232540" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">

<script id="s-base">
/* =====================================================================
   BASE DEL REPRODUCTOR: ayudantes que también puede usar el bloque de la clase.
   Dibujos planos (SVG): cada simulador tiene svg(), que devuelve el dibujo
   inicial, y pinta(), que lo actualiza con los valores.
   Los instrumentos usan colores neutros a propósito: rojo, lila y amarillo
   quedan reservados para nombrar las variables de la clase.
   ===================================================================== */
const TRAZO = 'fill="var(--papel)" stroke="var(--linea)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const NB = " ";
const num = (x, d = 0) => Number(x).toFixed(d).replace(".", ",");

function termo(x, y, h) {
  return `<g class="termo" data-y="${y}" data-h="${h}"><rect x="${x - 7}" y="${y}" width="14" height="${h}" rx="7"/><rect class="col" x="${x - 3}" y="${y + h - 20}" width="6" height="26" fill="var(--liq)" stroke="none"/><circle cx="${x}" cy="${y + h + 8}" r="10" fill="var(--liq)"/></g>`;
}
function pintaTermo(g, f) {
  const y = +g.dataset.y, h = +g.dataset.h, alto = 10 + Math.max(0, Math.min(1, f)) * (h - 22);
  const col = g.querySelector(".col");
  col.setAttribute("y", y + h - alto);
  col.setAttribute("height", alto + 6);
}
function mano(cx, cy, r) {
  const d = r * 0.62;
  return `<g class="mano" data-cx="${cx}" data-cy="${cy}"><circle cx="${cx}" cy="${cy}" r="${r}"/><path d="M${cx - r + 5} ${cy}h5M${cx} ${cy - r + 5}v5M${cx + r - 5} ${cy}h-5M${cx - d} ${cy - d}l3.5 3.5M${cx + d} ${cy - d}l-3.5 3.5" fill="none" stroke-width="2"/><path class="aguja" d="M${cx} ${cy}V${cy - r + 7}" fill="none" stroke="var(--tinta)" stroke-width="4.5"/><circle cx="${cx}" cy="${cy}" r="3.5" fill="var(--tinta)" stroke="none"/></g>`;
}
function pintaMano(g, f) {
  const a = -75 + Math.max(0, Math.min(1, f)) * 150;
  g.querySelector(".aguja").setAttribute("transform", `rotate(${a} ${g.dataset.cx} ${g.dataset.cy})`);
}
function puntos(lista, r) {
  return lista.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r || 2.6}"/>`).join("");
}
const pone = (svg, sel, txt) => { const e = svg.querySelector(sel); if (e) e.textContent = txt; };


/* Textos que usa el reproductor cuando el bloque de la clase no trae los suyos */
const TEXTOS_BASE = {
  autoOpciones: ["Lo logro solo", "Lo logro con ayuda", "Todavía no"],
  problema: {
    etiquetaInicial: "Mi conclusión",
    guardar: "Guardar mi conclusión",
    guardada: "Guardada. Aquí no hay respuestas buenas ni malas: la vas a revisar más adelante.",
    vacia: "Escribe aunque sea una idea. No tiene nota y la puedes cambiar más adelante.",
    antes: "Antes pensaba",
    ahora: "Ahora pienso que… porque vi…",
    ver: "Ver la explicación",
    primero: "Primero escribe lo que piensas ahora. Después aparece la explicación.",
    compara: "Compara: ¿qué parte de tu idea se mantiene y qué parte cambió?"
  }
};

/* Tablero de instrumentos: la figura de un simulador cuando la clase no trae un dibujo propio.
   Muestra cada instrumento como una barra con su nombre y su valor. */
const TABLERO = {
  svgDe(cols) {
    const alto = 26 + cols.length * 58;
    return `<svg viewBox="0 0 360 ${alto}" role="img" aria-label="Tablero con ${cols.length} instrumentos: ${cols.map(c => c.nombre).join(", ")}">${cols.map((c, i) => {
      const y = 22 + i * 58;
      return `<g data-k="${c.k}" data-min="${c.min}" data-max="${c.max}" data-dec="${c.dec || 0}" data-u="${c.unidad}"><text class="et" x="18" y="${y}">${c.nombre}</text><text class="et dato val" x="342" y="${y}" text-anchor="end"></text><rect x="18" y="${y + 8}" width="324" height="20" rx="10" fill="var(--papel)" stroke="var(--linea)" stroke-width="3"/><rect class="barra-v" x="21" y="${y + 11}" width="0" height="14" rx="7" fill="var(--liq)"/></g>`;
    }).join("")}</svg>`;
  },
  pintaDe(svg, v) {
    Array.from(svg.querySelectorAll("g[data-k]")).forEach(g => {
      const d = g.dataset, x = v[d.k], f = Math.max(0, Math.min(1, (x - d.min) / ((d.max - d.min) || 1)));
      g.querySelector(".barra-v").setAttribute("width", (14 + f * 304).toFixed(1));
      g.querySelector(".val").textContent = num(x, +d.dec) + NB + d.u;
    });
  },
  svg(s) { return this.svgDe(s.columnas.map(c => { const xs = s.niveles.map(n => n.v[c.k]); return Object.assign({}, c, { min: Math.min.apply(0, xs), max: Math.max.apply(0, xs) }); })); },
  pinta(svg, v) { this.pintaDe(svg, v); }
};

/* La figura de una pantalla se nombra con «figura» (también se acepta «dibujo») */
const figDe = o => o ? (o.figura || o.dibujo) : undefined;
/* =====================================================================
   MOTOR 3D: una cámara con partículas de gas dibujada con WebGL, escrita
   aquí mismo (sin Unity ni librerías: el archivo debe abrirse con doble
   clic y sin internet). El estudiante gira la vista; nada gira solo.
   Si el computador no tiene WebGL, devuelve null y la página usa su
   versión en 2D.
   ===================================================================== */
function Escena3D(cv, op) {
  op = Object.assign({ N: 70, V: 10, Vmax: 10, T: 300, piston: true }, op || {});
  let gl = null;
  try { gl = cv.getContext("webgl", { antialias: true, alpha: true }) || cv.getContext("experimental-webgl"); } catch (e) { gl = null; }
  if (!gl) return null;

  /* --- sombreadores --- */
  function prog(vs, fs) {
    const p = gl.createProgram();
    [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]].forEach(([t, s]) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); gl.attachShader(p, sh); });
    gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  let pPunto, pTri;
  try {
    pPunto = prog(
      "attribute vec3 p;attribute float tam;attribute vec4 col;attribute float tipo;uniform mat4 m;uniform float esc;varying vec4 vc;varying float vt;varying float vw;" +
      "void main(){vec4 q=m*vec4(p,1.);gl_Position=q;gl_PointSize=max(1.,tam*esc/q.w);vc=col;vt=tipo;vw=q.w;}",
      "precision mediump float;varying vec4 vc;varying float vt;varying float vw;uniform vec2 lejos;" +

<script type="application/json" id="s-clase">{"contrato":"aulalab-clase/1.0","constantes":{"VASOS":{"A":{"t0":60,"t1":10,"v0":250},"B":{"t0":20,"v0":250}},"CAJA":{"P":100,"V":10,"T":27}},"clase":{"tipo":"completa","meta":{"numero":3,"titulo":"Variables de los gases","asignatura":"Ciencias Naturales","curso":"7.º básico","duracion":90,"estudiantes":40,"oaCodigo":"CN07 OA 13","oaTema":"comportamiento de los gases ideales","oaTexto":"","objetivo":"Identificar las variables presión, volumen y temperatura de un gas, y las variables independiente, dependiente y controladas de una investigación, mediante situaciones experimentales y tablas de datos, manifestando rigurosidad al usar evidencia científica.","objetivoEstudiante":"Hoy identificas las variables de un gas y su rol en una investigación.","habilidad":"Identificar","pasosHabilidad":["Reconocer qué identificar.","Recordar información previa relacionada.","Reconocerla en lo presentado."],"actitud":"Rigurosidad al usar evidencia científica.","version":1},"criterios":[{"id":"c1","texto":"Reconozco presión, volumen y temperatura por su unidad o instrumento."},{"id":"c2","texto":"Distingo qué se cambia, qué se mide y qué queda igual."},{"id":"c3","texto":"Respaldo mi respuesta con una pista."}],"momentos":[{"id":"portada","nombre":"Inicio","min":1},{"id":"haz","nombre":"Haz ahora","min":6,"auto":"Recordé lo que ya sabía de los gases."},{"id":"prob","nombre":"Problemas","min":8},{"id":"sim","nombre":"Simuladores","min":15},{"id":"exp","nombre":"Explicación","min":12},{"id":"vuelta","nombre":"Problemas explicados","min":6,"auto":"Reconozco presión, volumen y temperatura por su unidad o instrumento."},{"id":"guiada","nombre":"Práctica guiada","min":16,"auto":"Distingo qué se cambia, qué se mide y qué queda igual."},{"id":"indep","nombre":"Práctica independiente","min":20,"auto":"Respaldo mi respuesta con una pista."},{"id":"ticket","nombre":"Ticket de salida","min":6,"auto":"Puedo explicarle a otra persona lo que aprendí hoy oces":[{"nombre":"Ana","cara":"ana","dice":"En los gases, la presión siempre es lo que se mide."},{"nombre":"Luis","cara":"luis","dice":"Depende de lo que haga quien investiga."}],"opciones":["Con Ana","Con Luis","Todavía no lo sé"],"correcta":1,"docente":"Cuenta cuántos eligen a Ana: es la idea principal que la clase pone a prueba («la presión siempre es lo que se mide»).","porque":"¿Por qué? Escríbelo en una frase.","guardado":"Guardado. Vas a volver a esta pregunta al final de la clase.","respuesta":"Luis. En la botella cerrada la presión se midió (VD); en los malvaviscos y en la jeringa se cambió a propósito (VI)."}},"problemas":[{"id":"p1","titulo":"La pelota que amaneció blanda","situacion":"Ayer en la tarde, con calor, la pelota de fútbol estaba dura. Hoy, en la mañana helada, está más blanda. Nadie la desinfló y no tiene hoyos.","pregunta":"¿Qué cambió en el aire de la pelota? ¿Qué quedó igual?","idea":"«Si la pelota está blanda, se le salió aire» (confunde la presión con la cantidad de aire).","sim":"s1","afirmacion":"Cambiaron la temperatura y la presión del aire. La cantidad de aire quedó igual.","evidencia":"En el simulador, la botella cerrada marcó 94 kPa en hielo y 111 kPa con secador, sin que entrara ni saliera aire.","razonamiento":"Con frío, las partículas se mueven más lento y chocan más suave contra las paredes: baja la presión y la pelota se siente blanda.","figura":"pelota"},{"id":"p2","titulo":"La bolsa de papas fritas en la cordillera","situacion":"La familia de Martina sube a la cordillera. Arriba hace más frío que en Santiago, pero la bolsa de papas fritas, todavía cerrada, está mucho más inflada.","pregunta":"¿Qué cambió en el aire de la bolsa? ¿Qué lo hizo cambiar?","idea":"«Un gas solo se infla si se calienta o si le entra más gas» (no considera la presión de afuera).","sim":"s2","afirmacion":"Cambió el volumen del aire de la bolsa, porque bajó la presión del aire de afuera. La cantidad de aire quedó igual.","evidencia":"En el simulador, www.howtosmile.org/resource/amazing-marshmallows"},"materiales":"Malvaviscos, botella de vidrio limpia y seca, bomba de vacío para vino con su tapón.","seguridad":"La botella de vidrio la manipula el docente. Los malvaviscos usados no se comen.","real":"Sí, si consigues la bomba de vacío para vino.","figura":"malvaviscos"},"g1":{"titulo":"Botella con globo","consigna":"Una botella de 2 L con un globo en la boca, dentro de una fuente con agua.","pred":{"pregunta":"Antes de probar, predice: en agua caliente, el globo…","opciones":["se infla","se desinfla","queda igual"]},"control":"Elige el agua, espera y registra tres mediciones o más.","niveles":[{"boton":"De la llave","v":{"t":20,"a":0}},{"boton":"Tibia","v":{"t":40,"a":6.4}},{"boton":"Caliente","v":{"t":50,"a":7.3}},{"boton":"Muy caliente","v":{"t":60,"a":8}}],"inicial":0,"columnas":[{"k":"t","nombre":"Termómetro del agua","unidad":"°C","dec":0},{"k":"a","nombre":"Ancho del globo","unidad":"cm","dec":1}],"espera":{"real":"3 min","ms":2600},"limite":"Es un modelo: el globo real opone resistencia y se infla menos.","modelo":"Gas ideal con presión y cantidad fijas: V = 2,00 L × T / 293, con T en kelvin. El globo es una esfera con el volumen que sobra de los 2,00 L.","cita":{"titulo":"Turning the Air Upside Down","institucion":"Universidad de Colorado en Boulder","url":"https://www.howtosmile.org/resource/turning-air-upside-down-warm-air-less-dense-cool-air"},"materiales":"Botella plástica de 2 L, globo, fuente grande, agua caliente de la llave y hielo.","seguridad":"Agua caliente de la llave, nunca hirviendo, y la manipula un adulto.","real":"Sí.","figura":"globo"},"g2":{"titulo":"Globo en la jeringa","consigna":"Un globo pequeño con aire, dentro de una jeringa tapada que tiene un manómetro.","control":"Mueve el émbolo, espera y registra tres mediciones o más.","niveles":[{"boton":"Tirar el émbolo","v":{"p":70,"a":2.3,"t":20}},{"boton":"Soltar","v":{"p":100,"a":2,"t":20}},{"boton":"Empujar un poco","v":{"p":130,"a":1.8,"t":20}},{"boton":"Empujar fuerte","v":{"p":160,"a":1.7,"t":20}}],"inicial":1,"columnas":[{"k":"p","nombre":"Manómetro","unidad":"kPa","dec":0},{"k":"a","nombre":"Ancho del globo","unidad":"cm","dec":1},{"k":"t","nombre":"Termómetro","unidad":"°C","dec":0}],"espera":{"real":"5 s","ms":1200},"limite":"Es un modelo: una jeringa real no trae manómetro y el globo no es una esfera perfecta.","modelo":"Gas ideal con temperatura y cantidad fijas: el volumen del globo es 100 kPa / P veces el inicial, y su ancho cambia con la raíz cúbica del volumen.","cita":{"titulo":"Boyle's Law Demonstration","institucion":"Science Buddies","url":"https://www.sciencebuddies.org/stem-activities/boyles-law"},"materiales":"Dos globos de agua pequeños, jeringa hermética de 60 mL sin aguja, tijeras y agua.","seguridad":"Jeringa sin aguja.","real":"Sí.","figura":"jeringa"}},"explicacion":[{"id":"e1","docente":"Hoy no se enseña ninguna fórmula ni ley: el objetivo es identificar variables. K aparece solo como unidad de temperatura.","titulo":"Tres variables describen un gas","texto":"En tus tablas aparecieron tres instrumentos. Cada uno mide una variable del gas.","tabla":{"cab":["Variable","Qué es","Unidades","Instrumento"],"dato":[2],"filas":[["P","Los choques de las partículas contra las paredes","kPa, atm","Manómetro"],["V","El espacio que ocupa el gas","L, mL, cm³","Recipiente graduado, regla"],["T","Qué tan rápido se mueven las partículas","°C, K","Termómetro"]]},"comprueba":{"pregunta":"Un instrumento marca 250 mL. ¿Qué variable mide?","opciones":["La presión","La temperatura","El volumen"],"correcta":2,"retro":["La presión se mide en kPa o atm. Los mL miden espacio.","La temperatura se mide en °C o K. Los mL miden espacio.","mL es una unidad de volumen: el espacio que ocupa el gas."]},"figura":"instrumentos"},{"id":"e2","titulo":"La presión son choques","texto":"Las partículas chocan contra las paredes: esos choques son la presión. Con el secador se mueven más rápido y chocan más fuerte. Por eso tu manómetro subió.","dato":{"sim":"s1","frase":"En tu tabla: {a}."},"caja":{"etiqueta":"Temperatura del aire","alt":"Modelo en tres dimensiones: partículas de aire que chocan contra las paredes de una caja cerrada","niveles":[{"boton":"Aire a 20 °C","T":293},{"boton":"Aire a 300 °C","T":573}],"nota":"Es un modelo: las partículas reales no se ven y son muchísimas más. Para que el cambio se note, calienta el aire a 300 °C: con el secador (50 °C) las partículas van solo un 5 % más rápido. Arrastra la caja para girarla."},"comprueba":{"pregunta":"La botella cerrada pasa de la mesa al hielo. ¿Qué pasa con los choques?","opciones":["Son más suaves","Son más fuertes","No cambian"],"correcta":0,"retro":["Con frío las partículas se mueven más lento: chocan más suave y la presión baja.","Eso pasa al calentar. En hielo las partículas se mueven más lento.","Cambian: tu manómetro marcó menos en hielo que sobre la mesa."]},"figura":"choques"},{"id":"e3","titulo":"El rol de cada variable","texto":"En una investigación, cada variable cumple un rol.","roles":[{"sigla":"VI","nombre":"Independiente","texto":"La cambias a propósito."},{"sigla":"VD","nombre":"Dependiente","texto":"La mides como resultado."},{"sigla":"VC","nombre":"Controladas","texto":"Las mantienes iguales."}],"comprueba":{"pregunta":"En la botella cerrada, ¿cuál fue la variable dependiente?","opciones":["La temperatura","La presión","La cantidad de aire"],"correcta":1,"retro":["La temperatura la cambiaste tú al elegir el lugar: fue la VI.","La leíste en el manómetro como resultado: fue la VD.","No cambió, porque la botella estaba cerrada: fue una VC."]},"figura":"roles"},{"id":"e4","docente":"Esta pantalla responde a Ana con evidencia de los dos simuladores. No la nombres todavía.","titulo":"La misma variable puede cambiar de rol","texto":"En la botella cerrada mediste la presión. En los malvaviscos la cambiaste tú, con la bomba. El rol no depende de la variable: depende de lo que hace quien investiga.","comprueba":{"pregunta":"En los malvaviscos, ¿qué rol tuvo la presión?","opciones":["VD: se midió como resultado","VC: se mantuvo igual","VI: se cambió a propósito"],"correcta":2,"retro":["Lo que mediste como resultado fue el tamaño del malvavisco.","Una VC no cambia, y tu manómetro bajó de 100 a 40 kPa.","La cambiaste a propósito con la bomba."]},"figura":"cambio"}],"linea":{"titulo":"¿Quiénes lo descubrieron?","consigna":"Toca un año y busca el parecido con tu clase.","desde":1640,"hasta":1860,"leidas":"9 de octubre de 2026","hitos":[{"anio":1643,"quien":"Evangelista Torricelli","corto":"Torricelli","lugar":"Italia","hallazgo":"Inventó el barómetro, un tubo con mercurio. Vio que su altura cambiaba de un día a otro por la presión del aire.","hoy":"Tu manómetro mide presión.","fuentes":[["Encyclopaedia Britannica, «Evangelista Torricelli»","https://www.britannica.com/biography/Evangelista-Torricelli"]],"figura":"barometro"},{"anio":1648,"quien":"Blaise Pascal y Florin Périer","corto":"Pascal y Périer","lugar":"Francia","hallazgo":"Périer subió un barómetro al cerro Puy de Dôme, a pedido de Pascal. Arriba el mercurio quedó más bajo: había menos presión.","hoy":"La bolsa en la cordillera.","fuentes":[["Museo Galileo, «Pascal's barometric experiment»","https://catalogue.museogalileo.it/multimedia/PascalsBarometricExperimentBis.html"],["Whipple Museum, Universidad de Cambridge, «Barometers»","https://www.whipplemuseum.cam.ac.uk/explore-whipple-collections/meteorology/barometers"]],"figura":"bolsa"},{"anio":1662,"quien":"Robert Boyle","corto":"Boyle","lugar":"Irlanda e Inglaterra","hallazgo":"Experimentó con una bomba de aire. Sus mediciones mostraron que, cuando la presión de un gas sube, su volumen baja.","hoy":"El globo en la jeringa.","fuentes":[["Science History Institute, «Robert Boyle»","https://www.sciencehistory.org/education/scientific-biographies/robert-boyle/"]],"figura":"sim:g2"},{"anio":1702,"quien":"Guillaume Amontons","corto":"Amontons","lugar":"Francia","hallazgo":"Construyó un termómetro de aire: medía la temperatura por el cambio de presión de una cantidad fija de aire encerrado.","hoy":"La botella cerrada.","fuentes":[["Encyclopaedia Britannica, «Guillaume Amontons»","https://www.britannica.com/biography/Guillaume-Amontons"]],"figura":"sim:s1"},{"anio":1738,"quien":"Daniel Bernoulli","corto":"Bernoulli","lugar":"Suiza","hallazgo":"Explicó la presión de un gas: es el efecto del impacto de sus partículas contra una superficie.","hoy":"«La presión son choques».","fuentes":[["Encyclopaedia Britannica, «Daniel Bernoulli»","https://www.britannica.com/biography/Daniel-Bernoulli"]],"figura":"choques"},{"anio":1746,"quien":"Laura Bassi","corto":"Bassi","lugar":"Italia","hallazgo":"Fue la primera profesora de física de una universidad europea, en Bolonia. Uno de sus trabajos trata sobre la compresión del aire.","hoy":"Comprimiste aire en la jeringa.","fuentes":[["Encyclopaedia Britannica, «Laura Bassi»","https://www.britannica.com/biography/Laura-Bassi"],["MacTutor, Universidad de St Andrews, «Laura Bassi»","https://mathshistory.st-andrews.ac.uk/Biographies/Bassi/"]],"figura":"sim:g2"},{"anio":1787,"quien":"Jacques Charles","corto":"Charles","lugar":"Francia","hallazgo":"Propuso que un gas ocupa más volumen cuando sube su temperatura, si la presión no cambia. Antes voló en un globo de hidrógeno.","hoy":"La botella con globo.","fuentes":[["Encyclopaedia Britannica, «Jacques Charles»","https://www.britannica.com/biography/Jacques-Charles"],["Encyclopaedia Britannica, «Charles's law»","https://www.britannica.com/science/Charless-law"]],"figura":"sim:g1"},{"anio":1789,"quien":"Marie-Anne Paulze Lavoisier","corto":"Paulze Lavoisier","lugar":"Francia","hallazgo":"Colaboradora científica de Antoine Lavoisier. Dibujó el laboratorio y sus instrumentos para el libro de química que él publicó ese año.","hoy":"Tus tablas: registrar con rigor.","fuentes":[["Science History Institute, «Antoine-Laurent Lavoisier»","https://www.sciencehistory.org/education/scientific-biographies/antoine-laurent-lavoisier/"]],"figura":"cuaderno"},{"anio":1856,"quien":"Eunice Foote","corto":"Foote","lugar":"Estados Unidos","hallazgo":"Puso al sol cilindros de vidrio con distintos gases y un termómetro en cada uno. El de dióxido de carbono se calentó más.","hoy":"Cambiar una cosa y medir otra.","fuentes":[["NOAA Climate.gov, «Happy 200th birthday to Eunice Foote, hidden climate science pioneer»","https://www.climate.gov/news-features/features/happy-200th-birthday-eunice-foote-hidden-climate-science-pioneer"]],"figura":"cilindros"}],"comprueba":{"pregunta":"¿Qué hallazgo explica lo que pasó con la bolsa de papas fritas?","opciones":["El de Charles, en 1787","El de Pascal y Périer, en 1648","El de Bernoulli, en 1738"],"correcta":1,"retro":["Charles estudió qué pasa al calentar un gas, y en la cordillera hacía más frío.","Mostraron que a más altura hay menos presión del aire: por eso el aire de la bolsa ocupó más espacio.","Bernoulli explicó qué es la presión. Busca quién la midió en lo alto de un cerro."]},"docente":"Dos minutos: muestra dos o tres hitos ligados a los simuladores de hoy (1648, 1702 y 1787) y deja el resto para estudiar. No pidas memorizar años. No hay personas de Chile ni de Latinoamérica porque no encontré un aporte verificable a estos contenidos: si conoces uno con su fuente, se agrega."},"sintesis":"Tres variables describen un gas: la presión, el volumen y la temperatura. La presión son los choques de las partículas contra las paredes: si el gas se calienta, las partículas se mueven más rápido y chocan más fuerte. En una investigación, cada variable cumple un rol. La variable independiente (VI) se cambia a propósito, la dependiente (VD) se mide como resultado y las controladas (VC) se mantienen iguales. La misma variable puede cambiar de rol: en la botella cerrada la presión se midió; en los malvaviscos se cambió con la bomba. El rol depende de lo que hace quien investiga.","glosario":[["Presión","Efecto de los choques de las partículas de un gas contra las paredes. Se mide en kPa."],["Manómetro","Instrumento que mide la presión de un gas encerrado."],["Variable independiente (VI)","La que se cambia a propósito."],["Variable dependiente (VD)","La que se mide como resultado."],["Variables controladas (VC)","Las que se mantienen iguales para comparar de forma justa."]],"bisagra":{"figura":"campana","titulo":"¿Cuál es la variable dependiente?","caso":"Un globo cerrado está dentro de una campana. Con una bomba, un grupo deja la presión en 100, 60 y 30 kPa. Cada vez mide el ancho del globo. La sala sigue a 20 °C.","opciones":["La temperatura","La presión","El volumen del globo"],"correcta":2,"retro":["La sala sigue a 20 °C: la temperatura no cambió. Es una VC.","Es la idea de Ana. Aquí la presión se dejó en 100, 60 y 30 kPa: se cambió a propósito, así que es la VI.","Midieron el ancho del globo, que muestra cuánto espacio ocupa el aire."],"errores":["Confunde una variable controlada con la dependiente.","Cree que en los gases la presión siempre es lo que se mide (idea de Ana).",""],"regla":"Con 80 % o más en C, pasa a los problemas explicados. Con menos, vuelve a «El rol de cada variable», modela con los malvaviscos y haz la segunda pregunta.","segunda":"Un grupo pone 1, 2 y 3 libros sobre el émbolo de una jeringa tapada y cada vez lee cuántos mL de aire quedan. ¿Cuál es la variable dependiente? (El volumen: es lo que leen cada vez.)"},"guiada":[{"id":"g1","rotulo":"Guiada 1 · Yo hago","corto":"Guiada 1","partes":[{"id":"g1a","tipo":"sim","sim":"g1","pred":true,"min":3,"docente":"Mide con el curso tres aguas. Puente que conviene decir en voz alta: «El ancho del globo muestra cuánto espacio ocupa el aire»."},{"id":"g1b","tipo":"pasos","min":5,"datos":"g1","titulo":"¿Qué rol tiene cada variable?","consigna":"Usa tus datos de la botella con globo. Responde cada paso y mira cómo se resuelve.","puente":"El ancho del globo muestra cuánto espacio ocupa el aire.","pasos":[{"pregunta":"¿Qué se cambió a propósito?","opciones":["P","V","T"],"correcta":"T","sigla":"VI","resuelto":"Recuerdo: la VI es la que se cambia a propósito. La reconozco: tú elegiste el agua. La VI es la temperatura."},{"pregunta":"¿Qué se midió como resultado?","opciones":["P","V","T"],"correcta":"V","sigla":"VD","resuelto":"Recuerdo: la VD es la que se mide. La reconozco: mediste el ancho del globo. La VD es el volumen."},{"pregunta":"¿Qué quedó igual?","opciones":["T","V","N"],"correcta":"N","sigla":"VC","resuelto":"Recuerdo: una VC no cambia. La reconozco: el globo cierra la botella y no entra ni sale aire. Una VC es la cantidad de aire."}],"fin":"Así se resuelve: una pista para cada rol. Ahora lo haces con menos ayuda.","docente":"VI temperatura · VD volumen (ancho del globo) · VC cantidad de aire. También vale como VC la presión de afuera."}]},{"id":"g2","rotulo":"Guiada 2 · Hacemos juntos","corto":"Guiada 2","partes":[{"id":"g2a","tipo":"sim","sim":"g2","min":3,"docente":"Aquí la presión se cambia a propósito al mover el émbolo: es evidencia directa contra la idea de Ana."},{"id":"g2b","tipo":"decidir","min":5,"datos":"g2","titulo":"Ahora con menos ayuda","consigna":"Usa tus datos del globo en la jeringa. Elige la variable y la pista de cada rol.","puente":"El ancho del globo muestra cuánto espacio ocupa el aire.","pistas":["Elegí cuánto mover el émbolo: el manómetro marcó lo que yo fijé","Medí el ancho del globo cada vez","El termómetro siguió en 20 °C","La jeringa está tapada: no entra ni sale aire"],"filas":[{"sigla":"VI","opciones":["P","V","T"],"correcta":["P"],"pista":{"P":0},"ayuda":"Pista: ¿qué decidiste tú cada vez, antes de leer los instrumentos?"},{"sigla":"VD","opciones":["P","V","T"],"correcta":["V"],"pista":{"V":1},"ayuda":"Pista: ¿qué anotaste como resultado?","error":{"P":"La presión la fijaste tú al mover el émbolo: no fue el resultado. ¿Qué anotaste después?"}},{"sigla":"VC","opciones":["T","V","N"],"correcta":["T","N"],"pista":{"T":2,"N":3},"ayuda":"Busca en tu tabla el instrumento que marcó siempre lo mismo."}],"fin":"Los tres roles tienen su pista. Fíjate: aquí la presión no se midió como resultado, la fijaste tú.","docente":"VI presión (movieron el émbolo) · VD volumen (ancho del globo) · VC temperatura o cantidad de aire."}]}],"independiente":[{"id":"i1","rotulo":"Independiente 1 · Primero intento solo","corto":"Independiente 1","partes":[{"id":"i1a","tipo":"observa","min":4,"titulo":"El vaso que sube el agua","consigna":"Dos vasos boca abajo sobre agua. El vaso A se calentó antes. Aprieta «Empezar» y mira los instrumentos.","objetos":[{"id":"A","nombre":"Vaso A"},{"id":"B","nombre":"Vaso B"}],"medidas":[{"k":"t","nombre":"Termómetro","unidad":"°C","dec":0},{"k":"v","nombre":"Aire en el vaso","unidad":"mL","dec":0}],"espera":{"real":"8 min","ms":16000,"minutos":8},"limite":"Es un modelo: en el vaso real también influye el vapor de agua.","modelo":"Gas ideal con presión y cantidad fijas: V = 250 mL × T / 333, con T en kelvin.","cita":{"titulo":"Suck it Up – with Cooling Air!","institucion":"Science Buddies","url":"https://www.sciencebuddies.org/stem-activities/suck-it-up--with-cooling-air"},"materiales":"Dos platos planos iguales, dos vasos transparentes iguales, hielo, fuente grande, agua caliente y fría de la llave, colorante opcional.","seguridad":"Agua caliente de la llave, nunca hirviendo, y la manipula un adulto.","real":"Sí.","docente":"No expliques por qué sube el agua: la tarea es identificar qué variables cambiaron.","figura":"vasos","estado":{"A":{"t":"VASOS.A.t0 + (VASOS.A.t1 - VASOS.A.t0) * (f >= 1 ? 1 : (1 - exp(-4 * f)) / (1 - exp(-4)))","v":"VASOS.A.v0 * (A.t + 273) / (VASOS.A.t0 + 273)"},"B":{"t":"VASOS.B.t0","v":"VASOS.B.v0"}}},{"id":"i1b","tipo":"tabla","min":6,"titulo":"¿Qué variables cambiaron?","consigna":"Completa la tabla con lo que viste. La página comprueba cuando termines.","cabecera":"Instrumento","datos":["Vaso A","Vaso B"],"columnas":[{"titulo":"¿Qué variable mide?","parte":"la variable","variables":["P","V","T"]},{"titulo":"Mi pista","parte":"la pista","opciones":["La unidad es °C","La unidad es mL","La unidad es kPa"]},{"titulo":"¿Dónde cambió?","parte":"dónde cambió","opciones":[["A","Solo en el vaso A"],["B","Solo en el vaso B"],["AB","En los dos"],["0","En ninguno"]]}],"filas":[{"nombre":"Termómetro","datos":["60 → 10 °C","20 → 20 °C"],"correctas":["T",0,"A"]},{"nombre":"Aire en el vaso","datos":["250 → 212 mL","250 → 250 mL"],"correctas":["V",1,"A"]}],"extra":{"pregunta":"¿Para qué sirve el vaso B?","opciones":["Para medir la presión","Para comparar: en él no se cambió nada","Para tener más agua"],"correcta":1,"retro":["Ningún instrumento de esta actividad mide la presión.","Como en el vaso B no cambió nada, se sabe que el cambio del vaso A se debe a que se enfrió.","El agua es la misma en los dos platos. Mira qué instrumentos cambiaron en cada vaso."]},"ayudas":["Relee la tabla y mira la unidad de cada instrumento.","°C mide qué tan caliente está algo. mL mide espacio.","Parte resuelta: el termómetro mide la temperatura. En el vaso A pasó de 60 a 10 °C: cambió solo en el vaso A."],"logrado":"Identificaste las dos variables, con su pista. El vaso B muestra que el cambio se debe a que el aire del vaso A se enfrió.","docente":"Termómetro: temperatura, pista °C, cambió solo en A. Aire en el vaso: volumen, pista mL, cambió solo en A. El vaso B sirve para comparar."}]},{"id":"i2","rotulo":"Independiente 2 · Ahora solo","corto":"Independiente 2","partes":[{"id":"i2","tipo":"investigacion","min":10,"titulo":"Mi investigación","consigna":"Una caja con aire y una pared que se mueve. Tú decides qué cambiar, qué medir y qué mantener igual.","variables":["P","V","T"],"base":{"P":100,"V":10,"T":27},"unidades":{"P":"kPa","V":"L","T":"°C"},"decimales":{"P":0,"V":1,"T":0},"instrumentos":{"P":"Manómetro","V":"Regla de la caja","T":"Termómetro"},"leo":{"P":"el manómetro","V":"la regla de la caja","T":"el termómetro"},"como":{"P":"Empujas la pared con más o con menos fuerza.","V":"Mueves la pared de la caja.","T":"Calientas o enfrías el aire."},"niveles":{"P":[100,125,160,200],"V":[10,8,6,5],"T":[27,77,127,227]},"noMedir":{"T":"Ese plan no se puede hacer: para que la temperatura cambie hay que calentar o enfriar el aire, es decir, cambiarla a propósito. Haz otro plan."},"caja":{"alt":"Caja con partículas de aire y una pared que se mueve","N":60,"Vmax":17,"V":"V","T":"T + 273"},"ayudas":["Relee tu plan: está sobre la tabla.","La VI se cambia a propósito, la VD se mide como resultado y una VC se mantiene igual.","Parte resuelta: tú elegiste los valores de {vi}. Lo que eliges tú es la VI."],"escrita":{"inicio":"La variable dependiente fue… porque…","criterios":["Nombré la variable que medí.","Di la pista: el instrumento que leí cada vez.","Usé un dato de mi tabla con su unidad."]},"limite":"Es un modelo: las partículas reales no se ven y son muchísimas más.","modelo":"Gas ideal con cantidad fija: P · V / T es constante, con T en kelvin. Referencia: 100 kPa, 10,0 L y 27 °C.","cita":{"titulo":"Gases: Intro","institucion":"PhET, Universidad de Colorado en Boulder","url":"https://phet.colorado.edu/es/simulations/gases-intro"},"materiales":"Es una simulación: no tiene versión con materiales.","seguridad":"","real":"No: ya es digital.","docente":"Hay cuatro planes posibles. La página no acepta medir la temperatura: para que cambie hay que calentar o enfriar, es decir, cambiarla a propósito. Quien elige «cambio a propósito la presión» usa la evidencia que contradice a Ana.","calculo":{"P":"CAJA.P * (CAJA.V / V) * ((T + 273) / (CAJA.T + 273))","V":"CAJA.V * (CAJA.P / P) * ((T + 273) / (CAJA.T + 273))"}}]}],"desafio":{"figura":"frascos","titulo":"¿Qué problema tiene esta investigación?","caso":"Un grupo calienta aire a 20 °C, 40 °C y 60 °C, pero usa un frasco chico, uno mediano y uno grande. Cada vez mide la presión.","inicio":"El problema es que…","modelo":"Cambian dos variables a la vez: la temperatura y el volumen. No se puede saber cuál produjo el cambio de presión. Mejora: usar el mismo frasco las tres veces.","criterios":["Nombré las dos variables que cambian.","Propuse cómo mejorar la investigación."]},"ticket":[{"id":"t1","criterio":"c1","texto":"El medidor de un neumático marca 220 kPa en la mañana fría y 240 kPa en la tarde calurosa. Nadie le puso ni le sacó aire. ¿Qué variable del aire registró el medidor?","opciones":["La temperatura","La presión","El volumen","La cantidad de aire"],"correcta":1,"retro":["La temperatura fue la causa del cambio, pero el medidor marca kPa: esa unidad no es de temperatura.","kPa es una unidad de presión.","El volumen se mide en L, mL o cm³. El medidor marca kPa.","Nadie puso ni sacó aire: la cantidad no cambió. kPa mide presión."],"errores":["Responde con la causa del cambio y no con lo que marca el instrumento.","","No reconoce kPa como unidad de presión.","Confunde la presión con la cantidad de aire."]},{"id":"t2","criterio":"c2","texto":"Tres jeringas tapadas iguales se dejan en el refrigerador (5 °C), en la sala (20 °C) y al sol (35 °C). Después se mide cuántos mL de aire tiene cada una. ¿Cuál es la variable independiente?","opciones":["El volumen","La presión","La temperatura","La cantidad de aire"],"correcta":2,"retro":["El volumen es lo que se midió después (los mL): es la VD.","Nadie cambió ni midió la presión en esta investigación.","Eligieron tres lugares con distinta temperatura: la cambiaron a propósito.","Las jeringas están tapadas: la cantidad de aire no cambia. Es una VC."],"errores":["Confunde la variable independiente con la dependiente.","Nombra una variable que nadie cambió ni midió.","","Confunde una variable controlada con la independiente."]},{"id":"t3","criterio":"c2","texto":"Un grupo pone espuma de afeitar en una campana y, con una bomba, deja la presión en 100, 70 y 40 kPa. Cada vez mide cuántos cm³ ocupa la espuma. ¿Cuál es la variable dependiente?","opciones":["El volumen","La presión","La temperatura","La bomba"],"correcta":0,"retro":["Midieron cuántos cm³ ocupa la espuma: cm³ es una unidad de volumen.","Es la idea de Ana. Aquí la presión se dejó en 100, 70 y 40 kPa: se cambió a propósito, es la VI.","Nadie cambió ni midió la temperatura en esta investigación.","La bomba es un instrumento, no una variable. Con ella cambiaron la presión."],"errores":["","Cree que en los gases la presión siempre es lo que se mide (idea de Ana).","Nombra una variable que nadie cambió ni midió.","Confunde un instrumento con una variable."]},{"id":"t4","criterio":"c3","texto":"Una lata cerrada y rígida se calienta a 30, 50 y 70 °C. Cada vez se lee el manómetro. Camila dice: «La variable dependiente es la presión». ¿Qué pista respalda su respuesta?","opciones":["La lata es rígida","Eligieron 30, 50 y 70 °C","En los gases siempre se mide la presión","Cada vez leyeron el manómetro"],"correcta":3,"retro":["Esa pista dice qué quedó igual (el volumen): respalda una VC.","Esa pista dice qué se cambió a propósito: respalda la VI.","Eso es una regla, no una pista de los datos. Y no siempre se cumple: en los malvaviscos la presión se cambió a propósito.","El manómetro mide la presión, y la leyeron como resultado cada vez."],"errores":["Usa la pista de una variable controlada.","Usa la pista de la variable independiente.","Responde con una regla en vez de una evidencia (idea de Ana).",""]}],"cierre":{"diag":"Al inicio elegiste: {x}. ¿Y ahora?","imprimir":"Imprimir mis respuestas","docenteTicket":"Quien responde «la presión» en la pregunta 3 mantiene la idea de Ana: empieza con ese grupo la próxima clase."},"docente":{"supuestos":["SUPUESTO: 90 minutos y 40 estudiantes.","SUPUESTO: el modelo de partículas se vio en las clases 1 y 2.","SUPUESTO: las leyes de los gases se formalizan en las clases siguientes; hoy no se muestra ninguna fórmula.","SUPUESTO: los puntos de partida de los simuladores (20 cm³ por malvavisco, 250 mL de aire en el vaso, aire a 60 °C) son valores cómodos de leer.","VERIFICAR: el te <script id="s-repro">
/* =====================================================================
   REPRODUCTOR DE CLASES
   Este programa no cambia de una clase a otra. Lee el BLOQUE DE LA CLASE
   (CLASE: textos, casos y valores; DIBUJOS: figuras y escenas) y arma las
   pantallas en el orden fijo: portada, Haz ahora, problemas, simuladores,
   explicación, problemas explicados, práctica guiada, práctica
   independiente, ticket de salida y resumen. Lo que el bloque no trae,
   simplemente no aparece.
   1. Utilidades y respuestas en memoria (nada se guarda ni se envía).
   2. Piezas que se repiten: alternativas, autoevaluación, simulador.
   3. Las pantallas, en el orden de la clase.
   4. Navegación, agenda y herramientas del docente.
   ===================================================================== */
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s === undefined || s === null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const LETRAS = ["A", "B", "C", "D", "E"];
  const sinMov = () => window.__SIN_ANIM || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  function arranca(C, D) {
  D = D || {};
  const FIJOS = D.fijos || {}, PLANOS = D.planos || {}, ESCENAS = D.escenas || {};
  const VARS = C.variables || {}, TX = Object.assign({}, TEXTOS_BASE, C.textos || {});
  document.title = `Clase ${C.meta.numero} ${C.meta.titulo}`;

  /* El cascarón de la página (agenda, pantalla y barra) se copia desde su molde */
  const molde = $("#cascaron");
  if (molde && !$("#app")) document.body.appendChild(molde.content.cloneNode(true));

  /* Respuestas de esta sesión: viven solo mientras la página está abierta */
  const R = { haz: {}, hazVisto: false, diag: { op: null, txt: "" }, prob: {}, sim: {}, comp: {}, bis: null, act: {}, des: {}, ticket: {}, ticketVisto: false, auto: {}, diagFinal: null };
  window.__R = R;

  /* ---------- Variables de la clase: cada una con su forma y su color ---------- */
  const FORMAS = ["p", "v", "t", "n"];
  const esVar = k => typeof k === "string" && Object.prototype.hasOwnProperty.call(VARS, k);
  const forma = k => VARS[k].forma || (FORMAS.indexOf(k.toLowerCase()) >= 0 ? k.toLowerCase() : FORMAS[Object.keys(VARS).indexOf(k) % 4]);
  const chip = k => {
    if (!esVar(k)) return esc(k);
    const v = VARS[k], f = forma(k), s = esc(v.simbolo || (f === "n" ? k.toLowerCase() : k));
    return `<span class="var ${f}"><i>${f === "t" ? `<span>${s}</span>` : s}</i> ${esc(v.nombre)}</span>`;
  };
  const con = k => VARS[k].con || VARS[k].nombre.toLowerCase();
  const marca = (el, bien, txt) => { el.className = "marca " + (bien ? "bien" : "revisa"); el.textContent = (bien ? "✓ " : "↻ ") + txt; };
  const valor = (x, col) => num(x, col.dec) + NB + col.unidad;
  const igual = (a, b) => String(a) === String(b);

  /* ---------- Registro de pantallas ---------- */
  const SL = [];
  const pantalla = o => SL.push(o);
  const mom = id => C.momentos.find(m => m.id === id);
  const hay = x => Array.isArray(x) ? x.length > 0 : !!x;

  /* ---------- Pieza: grupo de botones de una sola elección ---------- */
  function elegir(grupo, alElegir) {
    grupo.addEventListener("click", e => {
      const b = e.target.closest("button[data-v]");
      if (!b || !grupo.contains(b)) return;
      $$("button[data-v]", grupo).forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      alElegir(b.dataset.v, b);
    });
  }
  const botones = (ops, cls) => ops.map((o, i) => `<button class="btn ${cls || ""}" type="button" data-v="${i}" aria-pressed="false">${esc(o)}</button>`).join("");
  /* Opciones que pueden ser variables de la clase ("P", "V") o textos libres */
  const botonesOp = ops => ops.map((o, i) => `<button class="btn" type="button" data-v="${esVar(o) ? o : i}" aria-pressed="false">${esVar(o) ? esc(VARS[o].nombre) : esc(o)}</button>`).join("");
  const nombreOp = (ops, v) => esVar(v) ? con(v) : "«" + ops[+v] + "»";
  const alternativas = (ops, id) => `<div class="opciones ui" role="group" aria-label="Alternativas" id="${id}">${ops.map((o, i) => `<button class="btn" type="button" data-v="${i}" aria-pressed="false"><span class="letra">${LETRAS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;

  /* ---------- Pieza: autoevaluación al cerrar un momento ---------- */
  const autoHTML = m => m && m.auto ? `<div class="auto" data-auto="${m.id}"><b>¿Cómo voy?</b><span>${esc(m.auto)}</span><div class="grupo" role="group" aria-label="Autoevaluación de ${esc(m.nombre)}">${botones(C.autoOpciones || TX.autoOpciones)}</div></div>` : "";
  function autoInit(el) {
    $$(".auto", el).forEach(a => elegir($(".grupo", a), v => { R.auto[a.dataset.auto] = +v; }));
  }

  /* ---------- Pieza: «Compruébalo» (tres alternativas, explica cada una) ---------- */
  function compruebaHTML(id, c) {
    return `<div class="comprueba ui" data-comp="${id}"><span class="tit">Compruébalo</span><p>${esc(c.pregunta)}</p>
      <div class="grupo col" role="group" aria-label="Alternativas">${botones(c.opciones)}</div><p class="resp" aria-live="polite" hidden></p></div>`;
  }
  function compruebaInit(el, id, c) {
    const caja = $(`[data-comp="${id}"]`, el), resp = $(".resp", caja);
    elegir($(".grupo", caja), v => {
      const i = +v, bien = i === c.correcta;
      if (!R.comp[id]) R.comp[id] = { primero: i };
      R.comp[id].ahora = i;
      resp.hidden = false;
      resp.textContent = (bien ? "✓ Sí. " : "↻ Todavía no. ") + c.retro[i] + (bien ? "" : " Prueba otra.");
    });
  }

  /* ---------- Pieza: controles de una escena 3D (pausa y giro con botones, además de arrastrar) ---------- */
  window.__e3d = {};
  const ctl3d = () => `<div class="grupo ui c3d"><button class="btn" type="button" data-a3="pausa">Pausar</button><button class="btn" type="button" data-a3="izq" aria-label="Girar la vista hacia la izquierda">◀ Girar</button><button class="btn" type="button" data-a3="der" aria-label="Girar la vista hacia la derecha">Girar ▶</button></div>`;
  function ctl3dInit(el, e3) {
    const c = $(".c3d", el); if (!c) return;
    if (!e3.tresD) { $$('[data-a3="izq"],[data-a3="der"]', c).forEach(b => { b.hidden = true; }); $$(".solo3d", el).forEach(x => { x.hidden = true; }); }
    c.addEventListener("click", ev => {
      const b = ev.target.closest("[data-a3]"); if (!b) return;
      if (b.dataset.a3 === "pausa") b.textContent = e3.pausa() ? "Seguir" : "Pausar"; else e3.girar(b.dataset.a3 === "izq" ? -0.3 : 0.3, 0);
    });
  }

  /* ---------- Pieza: escena del motor 3D con su dibujo plano de respaldo ----------
     Solo la escena que se está mirando ocupa la tarjeta gráfica: se crea al entrar a la pantalla y se suelta al salir. */
  const HAY_GL = (() => { try { const c = document.createElement("canvas"), g = c.getContext("webgl") || c.getContext("experimental-webgl"); if (!g) return false; const x = g.getExtension("WEBGL_lose_context"); if (x) x.loseContext(); return true; } catch (e) { return false; } })();
  const defEscena = {};
  /* Una escena viene programada a medida (crea) o descrita con piezas (piezas) */
  function escena3(clave) {
    if (!(clave in defEscena)) { const e = ESCENAS[clave]; defEscena[clave] = !e ? null : e.crea ? e : EscenaPiezas(e); }
    return defEscena[clave];
  }
  function caja3dHTML(clave) {
    const d = escena3(clave); if (!d) return "";
    return `<div class="e3d-caja" data-3d="${clave}" hidden><div class="lienzo"><canvas class="sim e3d" tabindex="0" role="img" aria-label="${esc(d.alt || "Escena en tres dimensiones")}"></canvas><div class="rotulos" aria-hidden="true"></div></div>
      ${d.estados ? `<div class="grupo ui est3d" role="group" aria-label="${esc(d.rotuloEstados || "Momento que quieres ver")}">${d.estados.map((t, i) => `<button class="btn" type="button" data-v="${i}" aria-pressed="${i === 0}">${esc(t)}</button>`).join("")}</div>` : ""}
      ${ctl3d()}${d.nota ? `<p class="nota-modelo">${esc(d.nota)}</p>` : ""}</div>`;
  }
  /* Figura de una pantalla: la escena 3D si existe y, debajo, el dibujo plano que la reemplaza sin WebGL */
  const figuraHTML = (clave, cls) => !clave || (!ESCENAS[clave] && !FIJOS[clave]) ? "" : `<div class="vista3d ${cls || ""}">${caja3dHTML(clave)}${FIJOS[clave] ? `<figure class="figura plano3d">${FIJOS[clave]}</figure>` : ""}</div>`;
  function vista3d(caja, clave, alFallar) {
    const def = escena3(clave), plano = caja.parentElement.querySelector(".plano3d");
    if (!HAY_GL || !def) return null;
    let e3 = null, esc3 = null, val = null, ctx = {};
    const h = {
      tresD: true,
      pinta(v, c) { val = v; ctx = c || {}; if (esc3) esc3.pinta(val, ctx); },
      mostrar() {
        if (!h.tresD) return;
        if (!e3) {
          const viejo = $("canvas", caja), cv = viejo.cloneNode(false); viejo.replaceWith(cv); $(".rotulos", caja).innerHTML = "";
          e3 = Motor3D(cv, def.cam);
          if (!e3) { h.tresD = false; caja.hidden = true; if (plano) plano.hidden = false; if (alFallar) alFallar(); return; }
          esc3 = def.crea(e3); if (val) esc3.pinta(val, ctx);
        }
        e3.tema(); e3.ver(true);
      },
      ocultar() { if (e3) { e3.fin(); e3 = null; esc3 = null; } const b = $('[data-a3="pausa"]', caja); if (b) b.textContent = "Pausar"; },
      pausa() { return e3 ? e3.pausa() : false; },
      girar(a, b) { if (e3) e3.girar(a, b); },
      motor() { return e3; }
    };
    caja.hidden = false; if (plano) plano.hidden = true;
    ctl3dInit(caja, h);
    if (def.quieto) $('[data-a3="pausa"]', caja).hidden = true;
    if (def.estados) { h.pinta({ e: 0 }); elegir($(".est3d", caja), v => h.pinta({ e: +v })); }
    window.__e3d[clave] = h;
    return h;
  }
  const fijo3dInit = (el, clave) => { const c = clave ? $(`[data-3d="${clave}"]`, el) : null; return c ? vista3d(c, clave) : null; };
  const con3d = { alMostrar() { if (this.v3) this.v3.mostrar(); }, alOcultar() { if (this.v3) this.v3.ocultar(); } };

  /* ---------- Pieza: caja de partículas en 3D (con su versión plana) ---------- */
  function cajaParticulas(cv, V0, T0, Vmax) {
    const ctx = cv.getContext("2d"), W = cv.width, H = cv.height, N = 36, pts = [];
    let V = V0, T = T0, enPausa = false, visible = false, raf = 0, t0 = 0, s = 7;
    const azar = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    for (let i = 0; i < N; i++) { const a = azar() * 6.283; pts.push({ x: azar(), y: azar(), dx: Math.cos(a), dy: Math.sin(a) }); }
    const ancho = () => 40 + (W - 120) * Math.min(1, V / Vmax);
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    function dibuja() {
      const a = ancho();
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = css("--suave"); ctx.fillRect(20, 30, a, H - 60);
      ctx.strokeStyle = css("--linea"); ctx.lineWidth = 6; ctx.strokeRect(20, 30, a, H - 60);
      ctx.fillStyle = css("--tinta"); ctx.fillRect(20 + a - 3, 24, 16, H - 48); ctx.fillRect(20 + a + 13, H / 2 - 8, W, 16);
      ctx.fillStyle = css("--tinta-2");
      pts.forEach(p => { ctx.beginPath(); ctx.arc(28 + p.x * (a - 22), 38 + p.y * (H - 76), 7, 0, 6.283); ctx.fill(); });
    }
    function paso(t) {
      const dt = Math.min(0.05, (t - t0) / 1000); t0 = t;
      const v = 0.55 * Math.sqrt(T / 300), a = ancho();
      pts.forEach(p => {
        p.x += p.dx * v * dt * (W / a); p.y += p.dy * v * dt;
        if (p.x < 0) { p.x = 0; p.dx = Math.abs(p.dx); } if (p.x > 1) { p.x = 1; p.dx = -Math.abs(p.dx); }
        if (p.y < 0) { p.y = 0; p.dy = Math.abs(p.dy); } if (p.y > 1) { p.y = 1; p.dy = -Math.abs(p.dy); }
      });
      dibuja();
      if (visible && !enPausa && !sinMov()) raf = requestAnimationFrame(paso);
    }
    const arr = () => { cancelAnimationFrame(raf); dibuja(); if (visible && !enPausa && !sinMov()) { t0 = performance.now(); raf = requestAnimationFrame(paso); } };
    return {
      pon(v, t) { if (v !== undefined) V = v; if (t !== undefined) T = t; arr(); },
      pausa() { enPausa = !enPausa; arr(); return enPausa; },
      ver(si) { visible = si; arr(); }
    };
  }

  /* ---------- Pieza: respuesta escrita con frase modelo y criterios ---------- */
  const criteriosHTML = (id, lista, tit) => `<div class="chks">${tit ? `<b class="tit">${tit}</b>` : ""}${(lista || []).map((t, i) => `<label class="chk" for="${id}-c${i}"><input type="checkbox" id="${id}-c${i}">${esc(t)}</label>`).join("")}</div>`;

  /* ---------- Pieza: conteo de respuestas del curso (docente) ---------- */
  function conteoHTML(id, n) {
    return `<div class="conteo" data-conteo="${id}"><b>Conteo del curso:</b>${LETRAS.slice(0, n).map((l, i) => `<span>${l} <button class="btn" type="button" data-d="-1" data-i="${i}" aria-label="Quitar uno a ${l}">−</button><output>0</output><button class="btn" type="button" data-d="1" data-i="${i}" aria-label="Sumar uno a ${l}">+</button></span>`).join("")}<span class="dec"></span></div>`;
  }
  function conteoInit(el, correcta, regla) {
    const caja = $("[data-conteo]", el); if (!caja) return;
    const n = $$("output", caja).map(() => 0), dec = $(".dec", caja);
    caja.addEventListener("click", e => {
      const b = e.target.closest("button[data-d]"); if (!b) return;
      const i = +b.dataset.i; n[i] = Math.max(0, n[i] + (+b.dataset.d));
      $$("output", caja)[i].textContent = n[i];
      const total = n.reduce((a, x) => a + x, 0), pct = total ? Math.round(n[correcta] / total * 100) : 0;
      dec.textContent = total ? `${pct}${NB}% en ${LETRAS[correcta]} (${n[correcta]} de ${total}).` + (regla ? (pct >= 80 ? " Decisión: avanzar." : " Decisión: reenseñar y hacer la segunda pregunta.") : "") : "";
    });
  }

  /* =====================================================================
     SIMULADOR: elegir un valor, esperar, registrar. Cambia una variable
     por vez y nunca dice qué rol tiene cada una.
     ===================================================================== */
  const SIMS = C.sims || {};
  const planoDe = s => PLANOS[figDe(s)] || TABLERO;
  function simHTML(id, o) {
    const s = SIMS[id], d = planoDe(s);
    const ctl = s.pasos
      ? `<button class="btn fuerte" type="button" data-a="menos">${esc(s.pasos.menos)}</button><button class="btn" type="button" data-a="reset">${esc(s.pasos.reset)}</button>`
